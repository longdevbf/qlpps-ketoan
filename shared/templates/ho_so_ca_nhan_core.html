<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Hồ sơ cá nhân — QLPPS</title>
<link rel="icon" type="image/png" href="/static/papasan_icon_1024.png">
<link rel="shortcut icon" href="/static/papasan.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg-card);min-height:100vh;color:var(--text-1);overflow-x:hidden}
.page{max-width:1100px;margin:0 auto;padding:18px 16px}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;background:#fff;border-radius:10px;padding:6px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tab-btn{flex:0 0 auto;padding:9px 18px;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--text-3);cursor:pointer;border-radius:7px;transition:all .15s}
.tab-btn:hover{background:var(--brand-soft);color:var(--brand)}
.tab-btn.active{background:var(--brand-soft);color:var(--brand-hover)}

.banner{padding:12px 16px;border-radius:9px;margin-bottom:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.banner-info{background:var(--info-soft);color:var(--brand-hover);border-left:4px solid var(--brand)}
.banner-warn{background:var(--warning-soft);color:var(--warning-fg);border-left:4px solid var(--warning)}
.banner-success{background:var(--success-soft);color:var(--success-fg);border-left:4px solid var(--success)}
.banner-locked{background:var(--bg-page);color:var(--text-2);border-left:4px solid var(--text-3)}

.card{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 1px 5px rgba(0,0,0,.06);margin-bottom:14px}
.card-h{font-size:14px;font-weight:800;color:var(--brand);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bg-page);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px}
.field label .req{color:var(--danger);margin-left:2px}
.field input,.field select,.field textarea{padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:17px;color:var(--brand);background:#fff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--brand);box-shadow:var(--focus-ring)}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--bg-page);color:var(--text-3);cursor:not-allowed}
.field textarea{min-height:60px;resize:vertical}

.btn{padding:8px 18px;border-radius:7px;border:0;cursor:pointer;font-size:14px;font-weight:700;transition:all .15s}
.btn-primary{background:var(--brand-soft);color:var(--brand-hover)}
.btn-primary:hover{filter:brightness(.95)}
.btn-primary:disabled{background:var(--border);cursor:not-allowed}
.btn-secondary{background:var(--brand-soft);color:var(--brand);border:1.5px solid var(--brand-soft)}
.btn-danger{background:var(--danger-soft);color:var(--danger-fg);border:1.5px solid var(--danger-soft)}
.btn-warning{background:var(--warning-soft);color:var(--warning-fg);border:1.5px solid var(--warning)}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.doc-card{background:var(--bg-page);border:1.5px solid var(--border);border-radius:9px;padding:12px;position:relative}
.doc-card.has-file{background:var(--success-soft);border-color:var(--success-soft)}
.doc-card .doc-type{font-size:13px;font-weight:700;color:var(--brand);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.doc-card .doc-type .badge-req{background:var(--danger);color:#fff;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:700}
.doc-card .doc-file-info{font-size:12px;color:var(--text-3);margin:6px 0;line-height:1.5}
.doc-card .doc-actions{display:flex;gap:6px;margin-top:8px}
.doc-card .status-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px}
.status-cho_duyet{background:var(--warning-soft);color:var(--warning-fg)}
.status-da_duyet{background:var(--success-soft);color:var(--success-fg)}
.status-tu_choi{background:var(--danger-soft);color:var(--danger-fg)}

.upload-area{background:var(--brand-soft);border:2px dashed var(--brand-soft);border-radius:9px;padding:14px;text-align:center;cursor:pointer;transition:all .15s}
.upload-area:hover{background:var(--info-soft);border-color:var(--brand)}
.upload-area input[type=file]{display:none}

.emp-table{width:100%;border-collapse:collapse;font-size:14px}
.emp-table th,.emp-table td{padding:9px 11px;border-bottom:1px solid var(--bg-page);text-align:left}
.emp-table th{background:var(--bg-page);color:var(--text-2);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.emp-table tbody tr:hover{background:var(--bg-page);cursor:pointer}
.emp-table .ma-nv{font-family:'Courier New',monospace;font-weight:700;color:var(--brand)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:24px 12px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:900px;width:100%;padding:0;max-height:90vh;overflow-y:auto}
.modal-h{padding:16px 22px;border-bottom:1px solid var(--bg-page);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-h h2{font-size:17px;color:var(--brand)}
.modal-body{padding:18px 22px}
.modal-close{background:var(--danger-soft);color:var(--danger-fg);border:0;border-radius:6px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:14px}

.toast{position:fixed;bottom:24px;right:24px;background:var(--brand-soft);color:var(--brand-hover);padding:11px 18px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:300;font-weight:600;font-size:14px;display:none}
.toast.error{background:var(--danger)}
.toast.show{display:block;animation:slideIn .2s ease-out}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 16px;color:var(--text-3);font-size:14px}

/* ─── Mobile (điện thoại ~360–414px) ─── */
@media(max-width:600px){
  /* Lịch chấm công: giữ dạng 7 cột nhưng cho cuộn ngang để không vỡ ô */
  #me-cham-cong-calendar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #me-cham-cong-calendar>div[style*="grid-template-columns"]{min-width:420px}
  .tab-btn{padding:9px 12px;font-size:13px}
}
@media(max-width:480px){
  .page{padding:14px 10px}
  .card{padding:12px 12px}
}
</style>
</head>
<body>

{% include "_header.html" %}

<div class="page">

  <!-- ─── 2 TAB: Chấm công Lương / Thông tin cá nhân ─── -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-cc" onclick="switchProfileTab('cc')">Chấm Công &amp; Lương</button>
    <button class="tab-btn" id="tab-btn-me" onclick="switchProfileTab('me')">Thông tin cá nhân</button>
  </div>

  <!-- ───────── TAB 1: Chấm Công + Lương (default active) ───────── -->
  <div id="tab-pane-cc">
    <!-- Toolbar -->
    <div class="card" style="padding:12px 16px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label style="font-size:13px;font-weight:700;color:var(--text-2)">Tháng:</label>
        <input type="month" id="me-cc-month" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px" onchange="loadMyPayroll()">
        <button class="btn btn-secondary" onclick="loadMyPayroll()">Tải lại</button>
        <div id="me-cc-info" style="margin-left:auto;font-size:13px;color:var(--text-3)"></div>
      </div>
    </div>

    <!-- Tổng quan lương — 4 stat cards -->
    <div id="me-summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px"></div>

    <!-- Chi tiết bảng lương -->
    <div class="card">
      <div class="card-h">Bảng Lương Tháng — Chi Tiết</div>
      <div id="me-payroll-detail">
        <div class="empty"><div class="spinner"></div> Đang tải...</div>
      </div>
    </div>

    <!-- Lịch chấm công -->
    <div class="card">
      <div class="card-h">Lịch Chấm Công Trong Tháng</div>
      <div id="me-cham-cong-calendar"><div class="empty"><div class="spinner"></div> Đang tải...</div></div>
    </div>
  </div>

  <!-- ───────── TAB 2: Hồ sơ của tôi (cũ) ───────── -->
  <div id="tab-pane-me" style="display:none">
    <div id="me-banner"></div>
    <div id="me-content">
      <div class="card"><div class="empty"><div class="spinner"></div> Đang tải hồ sơ...</div></div>
    </div>

    <!-- ───────── Đổi mật khẩu ─────────────────────────────────────── -->
    <div class="card">
      <div class="card-h">Đổi mật khẩu</div>
      <div class="form-grid">
        <div class="field"><label>Mật khẩu hiện tại <span class="req">*</span></label>
          <input id="pw-cur" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại"></div>
        <div class="field"><label>Mật khẩu mới <span class="req">*</span></label>
          <input id="pw-new" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></div>
        <div class="field"><label>Xác nhận mật khẩu mới <span class="req">*</span></label>
          <input id="pw-cfm" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới"></div>
      </div>
      <div id="pw-msg" style="display:none;margin-top:10px;padding:8px 11px;border-radius:6px;font-size:13px;font-weight:600"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="pw-submit" onclick="submitChangePwd()">Đổi mật khẩu</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const fmtSize = b => !b ? '' : b < 1024 ? b + 'B' : b < 1048576 ? (b/1024).toFixed(1) + 'KB' : (b/1048576).toFixed(1) + 'MB';
const fmtDate = s => s ? new Date(s).toLocaleString('vi-VN') : '—';
const fmtShortDate = s => s ? new Date(s).toLocaleDateString('vi-VN') : '—';
let _currentUser = null;
let _meProfile = null;
let _loaiOptions = [];

function toast(msg, isErr = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2400);
}
async function api(method, url, body, isForm) {
  const opts = { method, credentials: 'include', headers: {} };
  if (body) {
    if (isForm) { opts.body = body; }
    else { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  }
  const r = await fetch(url, opts);
  if (r.status === 401) { window.location.href = '/login'; return null; }
  if (r.status === 204) return null;
  const ct = r.headers.get('Content-Type') || '';
  const d = ct.includes('application/json') ? await r.json() : await r.text();
  if (!r.ok) { const err = (d && d.detail) || d || 'Lỗi'; throw new Error(typeof err === 'string' ? err : JSON.stringify(err)); }
  return d;
}

// ── Init ────────────────────────────────────────────────────────────────────
// Anh Quang 2026-06-06: Tab 1 (Chấm công Lương) phải chạy ngay cả khi
// /api/profile-workflow/meta/loai-giay-to (chỉ có HCNS) trả 404 ở baogia/...
(async () => {
  // Set default month input = current month
  const now = new Date();
  const mInput = $('me-cc-month');
  if(mInput) mInput.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // Tab 1 — quan trọng nhất, gọi NGAY và độc lập
  loadMyPayroll().catch(e => console.warn('loadMyPayroll:', e));

  // Phụ trợ: profile + meta cho Tab 2, fail-soft không block Tab 1
  try { _currentUser = await api('GET', '/api/profile'); }
  catch (e) { console.warn('profile:', e); }
  try {
    const meta = await api('GET', '/api/profile-workflow/meta/loai-giay-to');
    _loaiOptions = meta.options || [];
  } catch (e) { console.warn('meta loai-giay-to (chỉ HCNS):', e); }
  loadMyProfile().catch(e => console.warn('loadMyProfile:', e));
})();

function switchProfileTab(name){
  ['cc','me'].forEach(n => {
    const pane = $('tab-pane-'+n), btn = $('tab-btn-'+n);
    if(pane) pane.style.display = (n===name ? '' : 'none');
    if(btn)  btn.classList.toggle('active', n===name);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// TAB 1 — Chấm Công + Lương cá nhân (data từ /api/payroll/me)
// ═══════════════════════════════════════════════════════════════════════════
const fmtVnd = n => Number(n||0).toLocaleString('vi-VN');

async function loadMyPayroll(){
  const thang = $('me-cc-month').value;
  if(!thang) return;
  $('me-summary').innerHTML = '';
    $('me-payroll-detail').innerHTML = '<div class="empty"><div class="spinner"></div> Đang tải...</div>';
  $('me-cham-cong-calendar').innerHTML = '<div class="empty"><div class="spinner"></div> Đang tải...</div>';
  try {
    const d = await api('GET', `/api/payroll/me?thang=${thang}`);
    const e = d.employee || {};
    const p = d.payroll;
    const [y,m] = thang.split('-');
    $('me-cc-info').textContent = `${e.ma_nv} • ${e.ho_ten} • ${e.phong_ban||'—'}`;
    if(!p){
      $('me-summary').innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty">Tháng ${m}/${y}: chưa có dữ liệu lương (NV chưa active hoặc nghỉ trước tháng này).</div></div>`;
      $('me-payroll-detail').innerHTML = '';
      renderMyChamCong(d.cham_cong || [], y, m);
      return;
    }
    // 4 stat cards
    $('me-summary').innerHTML = `
      <div class="card" style="padding:14px;border-left:5px solid var(--brand)">
        <div style="font-size:12px;color:var(--text-3);text-transform:uppercase;font-weight:700">Lương cơ bản</div>
        <div style="font-size:20px;font-weight:800;color:var(--brand-hover);margin-top:4px">${fmtVnd(p.luong_co_ban)}đ</div>
      </div>
      <div class="card" style="padding:14px;border-left:5px solid var(--success)">
        <div style="font-size:12px;color:var(--text-3);text-transform:uppercase;font-weight:700">Số ngày công</div>
        <div style="font-size:20px;font-weight:800;color:var(--success-fg);margin-top:4px">${Number(p.so_ngay_cong||0).toFixed(2)} ngày</div>
      </div>
      <div class="card" style="padding:14px;border-left:5px solid var(--warning)">
        <div style="font-size:12px;color:var(--text-3);text-transform:uppercase;font-weight:700">Tổng cộng</div>
        <div style="font-size:20px;font-weight:800;color:var(--warning-fg);margin-top:4px">${fmtVnd(p.tong_cong)}đ</div>
      </div>
      <div class="card" style="padding:14px;border-left:5px solid var(--success);background:var(--success-soft)">
        <div style="font-size:12px;color:var(--text-3);text-transform:uppercase;font-weight:700">Thực Nhận</div>
        <div style="font-size:25px;font-weight:900;color:var(--success-fg);margin-top:4px">${fmtVnd(p.luong_thuc_nhan)}đ</div>
      </div>
    `;
    // Detail breakdown
    const rowKv = (lbl, val, color) => `<tr><td style="padding:8px 12px;color:var(--text-2)">${lbl}</td><td style="padding:8px 12px;text-align:right;font-weight:700;color:${color||'var(--text-1)'};font-variant-numeric:tabular-nums">${fmtVnd(val)}đ</td></tr>`;
    const cong = [
      ['+ Lương theo công', p.luong_theo_cong, 'var(--brand-hover)'],
      ['+ Ăn trưa', p.an_trua, 'var(--success-fg)'],
      ['+ Trách nhiệm', p.trach_nhiem, 'var(--warning-fg)'],
      ['+ Công tác xưởng', p.cong_tac_xuong, 'var(--brand-hover)'],
      ['+ Hoa hồng', p.hoa_hong, 'var(--brand-hover)'],
      ['+ OT ca gãy', p.ot_ca_gay, 'var(--success-fg)'],
      ['+ Trực tối', p.truc_toi, 'var(--brand-hover)'],
      ['+ Tối ưu KD', p.toi_uu_kd, 'var(--brand-hover)'],
    ];
    const tru = [
      ['− BHXH (10.5%)', p.bhxh_tru, 'var(--danger-fg)'],
      ['− Đoàn phí công đoàn', p.doan_phi_tru, 'var(--danger)'],
      ['− Ứng lương' + (p.ung_luong_so_lan?` (${p.ung_luong_so_lan} lần)`:''), p.ung_luong||0, 'var(--danger-fg)'],
    ];
    const _m5=(p.luong_theo_cong||0)+(p.an_trua||0)-(p.bhxh_tru||0)-(p.ung_luong||0)-(p.doan_phi_tru||0); const _m15=(p.luong_thuc_nhan||0)-_m5;
    $('me-payroll-detail').innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <tbody>
          <tr><td colspan="2" style="padding:9px 12px;background:var(--info-soft);color:var(--brand-hover);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.3px">Khoản cộng (tổng: ${fmtVnd(p.tong_cong)}đ)</td></tr>
          ${cong.map(([l,v,c]) => rowKv(l,v,c)).join('')}
          <tr><td colspan="2" style="padding:9px 12px;background:var(--danger-soft);color:var(--danger-fg);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.3px">Khoản trừ (tổng: ${fmtVnd(p.tong_tru)}đ)</td></tr>
          ${tru.map(([l,v,c]) => rowKv(l,v,c)).join('')}
          <tr style="background:var(--success-soft)">
            <td style="padding:14px 12px;font-weight:800;color:var(--success-fg);font-size:15px">Lương thực nhận</td>
            <td style="padding:14px 12px;text-align:right;font-weight:900;color:var(--success-fg);font-size:18px;font-variant-numeric:tabular-nums">${fmtVnd(p.luong_thuc_nhan)}đ</td>
          </tr>
          <tr style="background:#eff6ff">
            <td style="padding:12px;font-weight:800;color:#1e40af;font-size:13px">📅 Lương trả M5 <span style="font-weight:400;color:#64748b;font-size:10px">(cứng+ăn trưa−BHXH−ứng−CĐ)</span></td>
            <td style="padding:12px;text-align:right;font-weight:900;color:#1e40af;font-size:16px;font-variant-numeric:tabular-nums">${fmtVnd(_m5)}đ</td>
          </tr>
          <tr style="background:#eff6ff">
            <td style="padding:12px;font-weight:800;color:#0369a1;font-size:13px">📅 Lương trả M15 <span style="font-weight:400;color:#64748b;font-size:10px">(phần còn lại)</span></td>
            <td style="padding:12px;text-align:right;font-weight:900;color:#0369a1;font-size:16px;font-variant-numeric:tabular-nums">${fmtVnd(_m15)}đ</td>
          </tr>
        </tbody>
      </table>
    `;
    renderMyChamCong(d.cham_cong || [], y, m);
  } catch(e){
    $('me-summary').innerHTML = '';
    $('me-payroll-detail').innerHTML = `<div class="empty" style="color:var(--danger)">${esc(e.message)}</div>`;
    $('me-cham-cong-calendar').innerHTML = '';
  }
}

function renderMyChamCong(items, y, m){
  const wrap = $('me-cham-cong-calendar');
  const ccMap = {};
  for(const c of items){ ccMap[c.ngay] = c; }
  const ndays = new Date(parseInt(y), parseInt(m), 0).getDate();
  let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:13px">';
  const dayNames = ['T2','T3','T4','T5','T6','T7','CN'];
  dayNames.forEach(d => html += `<div style="font-weight:800;color:var(--text-2);text-align:center;padding:6px;min-width:0;overflow:hidden">${d}</div>`);
  const firstDay = new Date(parseInt(y), parseInt(m)-1, 1);
  const firstWeekday = (firstDay.getDay() + 6) % 7;  // T2=0..CN=6
  for(let i = 0; i < firstWeekday; i++) html += '<div></div>';
  let totalHours = 0, daysWorked = 0;
  for(let d = 1; d <= ndays; d++){
    const date = `${y}-${m}-${String(d).padStart(2,'0')}`;
    const cc = ccMap[date];
    const dayOfWeek = (new Date(parseInt(y), parseInt(m)-1, d).getDay() + 6) % 7;
    const isSunday = dayOfWeek === 6;
    let bg = 'var(--bg-page)', col = 'var(--text-3)', content = '';
    if(cc && cc.tong_gio > 0){
      totalHours += cc.tong_gio;
      daysWorked++;
      const pct = Math.min(100, cc.tong_gio / 8 * 100);
      bg = pct >= 100 ? 'var(--success-soft)' : (pct >= 50 ? 'var(--warning-soft)' : 'var(--danger-soft)');
      col = pct >= 100 ? 'var(--success-fg)' : (pct >= 50 ? 'var(--warning-fg)' : 'var(--danger-fg)');
      content = `<div style="font-size:11px;font-weight:700">${cc.tong_gio.toFixed(1)}h</div>` +
                (cc.gio_vao ? `<div style="font-size:12px;opacity:.85">${cc.gio_vao}-${cc.gio_ra||'?'}</div>` : '');
    } else if(isSunday){
      bg = 'var(--brand-soft)'; col = 'var(--brand-hover)';
    }
    html += `<div style="background:${bg};color:${col};padding:7px 4px;border-radius:7px;min-height:50px;text-align:center;line-height:1.3;min-width:0;overflow:hidden">
      <div style="font-weight:800;font-size:14px">${d}</div>
      ${content}
    </div>`;
  }
  html += '</div>';
  html = `<div style="margin-bottom:10px;font-size:13px;color:var(--text-2)"><strong>${daysWorked} ngày làm việc</strong> • <strong>${totalHours.toFixed(1)}h</strong> tổng • TB ${daysWorked?(totalHours/daysWorked).toFixed(1):'0'}h/ngày</div>` + html;
  wrap.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
// Hồ sơ của tôi (NV view only)
// ═══════════════════════════════════════════════════════════════════════════
async function loadMyProfile() {
  try {
    const p = await api('GET', '/api/profile-workflow/me');
    _meProfile = p;
    renderMyBanner(p);
    renderMyContent(p);
  } catch (e) {
    $('me-content').innerHTML = `<div class="card"><div class="empty" style="color:var(--danger)">${esc(e.message)}</div></div>`;
  }
}

function renderMyBanner(p) {
  const s = p.profile_status;
  let html = '';
  if (s === 'chua_nop') {
    const haveLoai = new Set((p.documents || []).map(d => d.loai_giay_to));
    const missing = _loaiOptions.filter(o => o.required && !haveLoai.has(o.value)).map(o => o.label);
    const docTxt = missing.length ? `<br>Còn thiếu: <b>${missing.map(esc).join(', ')}</b>` : '';
    html = `<div class="banner banner-info"><div>Hồ sơ <b>chưa hoàn thiện</b> — vui lòng điền đủ thông tin + upload tài liệu bắt buộc → nhấn <b>"Gửi xét duyệt"</b>.${docTxt}</div></div>`;
  } else if (s === 'cho_duyet') {
    html = `<div class="banner banner-warn"><div>Hồ sơ đã gửi <b>${fmtDate(p.profile_submitted_at)}</b> — đang chờ HCNS duyệt. Form đã khoá.</div></div>`;
  } else if (s === 'da_duyet') {
    html = `<div class="banner banner-success">✓ <div>Hồ sơ đã được HCNS <b>duyệt ${fmtDate(p.profile_approved_at)}</b> bởi <b>${esc(p.profile_approved_by || '—')}</b>. Liên hệ HCNS để cập nhật.</div></div>`;
  }
  $('me-banner').innerHTML = html;
}

function renderMyContent(p) {
  const editable = p.profile_status === 'chua_nop';
  const ro = editable ? '' : 'disabled';
  $('me-content').innerHTML = `
    <div class="card">
      <div class="card-h">Thông tin cá nhân</div>
      <div class="form-grid">
        <div class="field"><label>Mã NV</label><input value="${esc(p.ma_nv)}" disabled></div>
        <div class="field"><label>Username</label><input value="${esc(p.username || '')}" disabled></div>
        <div class="field"><label>Họ tên <span class="req">*</span></label><input id="f-ho_ten" value="${esc(p.ho_ten || '')}" ${ro}></div>
        <div class="field"><label>Ngày sinh <span class="req">*</span></label><input id="f-ngay_sinh" type="date" value="${p.ngay_sinh || ''}" ${ro}></div>
        <div class="field"><label>Giới tính <span class="req">*</span></label>
          <select id="f-gioi_tinh" ${ro}>
            <option value="">—</option>
            <option value="Nam" ${p.gioi_tinh==='Nam'?'selected':''}>Nam</option>
            <option value="Nữ" ${p.gioi_tinh==='Nữ'?'selected':''}>Nữ</option>
            <option value="Khác" ${p.gioi_tinh==='Khác'?'selected':''}>Khác</option>
          </select></div>
        <div class="field"><label>CCCD/CMND <span class="req">*</span></label><input id="f-cccd" value="${esc(p.cccd || '')}" ${ro}></div>
        <div class="field"><label>Điện thoại <span class="req">*</span></label><input id="f-dien_thoai" value="${esc(p.dien_thoai || '')}" ${ro}></div>
        <div class="field"><label>Email</label><input id="f-email" type="email" value="${esc(p.email || '')}" ${ro}></div>
        <div class="field" style="grid-column:span 2"><label>Địa chỉ <span class="req">*</span></label><textarea id="f-dia_chi" ${ro}>${esc(p.dia_chi || '')}</textarea></div>
        <div class="field"><label>Phòng ban</label><input value="${esc(p.phong_ban || '')}" disabled></div>
        <div class="field"><label>Chức vụ</label><input value="${esc(p.chuc_vu || '')}" disabled></div>
      </div>
      ${editable ? `<div class="btn-row"><button class="btn btn-primary" onclick="saveMyInfo()">Lưu thông tin</button></div>` : ''}
    </div>

    <div class="card">
      <div class="card-h">Tài liệu cá nhân
        <span style="margin-left:auto;font-weight:500;font-size:12px;color:var(--text-3);text-transform:none">
          Tài liệu có dấu <span style="background:var(--danger);color:#fff;padding:1px 5px;border-radius:3px;font-size:10px">BẮT BUỘC</span> là cần thiết khi gửi xét duyệt
        </span>
      </div>
      <div class="docs-grid" id="me-docs">${renderMyDocs(p)}</div>
      ${renderUploadArea(p)}
    </div>

    ${p.profile_status === 'chua_nop' ? `
      <div class="card" style="border:2px solid var(--success-fg);background:var(--success-soft)">
        <div style="text-align:center;font-size:14px;color:var(--success-fg);margin-bottom:10px">
          Sau khi điền đủ thông tin + upload đủ tài liệu bắt buộc → nhấn nút để gửi cho HCNS duyệt:
        </div>
        <div style="text-align:center">
          <button class="btn btn-primary" style="padding:11px 28px;font-size:15px" onclick="submitMyProfile()">
            Gửi xét duyệt
          </button>
        </div>
      </div>
    ` : ''}
  `;
}

function renderMyDocs(p) {
  const docs = p.documents || [];
  if (!docs.length) return '<div class="empty">Chưa có tài liệu — upload bên dưới</div>';
  return docs.map(d => {
    // Chỉ xoá được doc CHƯA DUYỆT (đã duyệt → liên hệ HCNS)
    const canDelete = d.trang_thai !== 'da_duyet';
    return `<div class="doc-card has-file">
      <div class="doc-type">${esc(d.loai_label)}</div>
      <div class="doc-file-info">
        <b>${esc(d.ten_file || '—')}</b><br>
        ${fmtSize(d.file_size)} · ${fmtShortDate(d.ngay_upload)}<br>
        <span class="status-badge status-${d.trang_thai}">${d.trang_thai === 'da_duyet' ? '✓ Đã duyệt' : d.trang_thai === 'tu_choi' ? '✗ Từ chối' : 'Chờ duyệt'}</span>
      </div>
      ${d.ghi_chu_hcns ? `<div style="font-size:11px;color:var(--warning-fg);background:var(--warning-soft);padding:4px 7px;border-radius:4px;margin-top:5px"><b>HCNS:</b> ${esc(d.ghi_chu_hcns)}</div>` : ''}
      <div class="doc-actions">
        <button type="button" class="btn btn-secondary" style="font-size:12px;padding:4px 10px" onclick="event.stopPropagation();previewFile('${esc(d.file_url)}','${esc(d.ten_file||'')}','${esc(d.mime_type||'')}')">Xem</button>
        ${canDelete ? `<button class="btn btn-danger" style="font-size:12px;padding:4px 10px" onclick="deleteMyDoc(${d.id})">Xoá</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderUploadArea(p) {
  // KHÔNG filter "remaining" — cho phép upload nhiều bản cùng loại (bổ sung, sửa đổi)
  const isApproved = p.profile_status === 'da_duyet';
  const noticeHtml = isApproved
    ? `<div style="background:var(--info-soft);color:var(--brand-hover);padding:8px 11px;border-radius:7px;font-size:12px;margin-bottom:8px;border-left:3px solid var(--brand)">
         Hồ sơ đã duyệt — tài liệu mới upload sẽ ở trạng thái <b>"Chờ duyệt"</b> và HCNS sẽ duyệt riêng từng file.
       </div>`
    : '';
  return `<div style="margin-top:14px">
    <div style="font-weight:700;font-size:13px;color:var(--brand);margin-bottom:8px;text-transform:uppercase">Upload tài liệu mới</div>
    ${noticeHtml}
    <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap">
      <div class="field" style="flex:1;min-width:140px">
        <label>Loại tài liệu</label>
        <select id="upload-loai">
          ${_loaiOptions.map(o => `<option value="${esc(o.value)}">${esc(o.label)}${o.required ? ' *' : ''}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="flex:2;min-width:160px">
        <label>File (PDF/JPG/PNG, ≤20MB)</label>
        <input id="upload-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp">
      </div>
      <button class="btn btn-primary" onclick="uploadMyDoc()">Upload</button>
    </div>
  </div>`;
}

async function saveMyInfo() {
  const body = {
    ho_ten:     $('f-ho_ten').value.trim(),
    ngay_sinh:  $('f-ngay_sinh').value || null,
    gioi_tinh:  $('f-gioi_tinh').value || null,
    cccd:       $('f-cccd').value.trim() || null,
    dien_thoai: $('f-dien_thoai').value.trim() || null,
    email:      $('f-email').value.trim() || null,
    dia_chi:    $('f-dia_chi').value.trim() || null,
  };
  try {
    await api('PUT', '/api/profile-workflow/me', body);
    toast('✓ Đã lưu thông tin');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function uploadMyDoc() {
  const loai = $('upload-loai').value;
  const file = $('upload-file').files[0];
  if (!file) { toast('Chọn file trước', true); return; }
  const fd = new FormData();
  fd.append('loai_giay_to', loai);
  fd.append('file', file);
  try {
    await api('POST', '/api/profile-workflow/me/documents', fd, true);
    toast('✓ Upload thành công');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function deleteMyDoc(id) {
  if (!confirm('Xoá tài liệu này?')) return;
  try {
    await api('DELETE', '/api/profile-workflow/me/documents/' + id);
    toast('✓ Đã xoá');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function submitMyProfile() {
  if (!confirm('Gửi hồ sơ để HCNS duyệt? Sau khi gửi, anh sẽ không tự sửa được nữa.')) return;
  try {
    await api('POST', '/api/profile-workflow/me/submit');
    toast('✓ Đã gửi cho HCNS');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

// ═══════════════════════════════════════════════════════════════════════════
// Đổi mật khẩu
// ═══════════════════════════════════════════════════════════════════════════
function _pwShowMsg(text, ok) {
  const el = $('pw-msg');
  el.style.display = 'block';
  el.style.background = ok ? 'var(--success-soft)' : 'var(--danger-soft)';
  el.style.color = ok ? 'var(--success-fg)' : 'var(--danger-fg)';
  el.textContent = text;
}
async function submitChangePwd() {
  const cur = $('pw-cur').value;
  const nw  = $('pw-new').value;
  const cfm = $('pw-cfm').value;
  if (!cur || !nw || !cfm) { _pwShowMsg('Vui lòng điền đầy đủ', false); return; }
  if (nw !== cfm)          { _pwShowMsg('Mật khẩu mới và xác nhận không khớp', false); return; }
  if (nw.length < 6)       { _pwShowMsg('Mật khẩu mới phải ít nhất 6 ký tự', false); return; }
  const btn = $('pw-submit');
  btn.disabled = true; btn.textContent = 'Đang xử lý...';
  try {
    const r = await fetch('/api/profile', {
      method: 'PUT', headers: {'Content-Type':'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({ action: 'change_password', current_password: cur, new_password: nw, confirm_password: cfm }),
    });
    if (r.status === 401) { _pwShowMsg('Phiên đăng nhập hết — vui lòng login lại', false); return; }
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      _pwShowMsg('Đổi mật khẩu thành công', true);
      $('pw-cur').value = ''; $('pw-new').value = ''; $('pw-cfm').value = '';
      toast('✓ Đã đổi mật khẩu');
    } else {
      _pwShowMsg('' + (d.error || d.detail || ('HTTP ' + r.status)), false);
    }
  } catch (e) {
    _pwShowMsg('Lỗi: ' + (e.message || e), false);
  } finally {
    btn.disabled = false; btn.textContent = 'Đổi mật khẩu';
  }
}

</script>
<!-- Lightbox xem tài liệu (popup, không tải về) -->
<div id="qlbx" style="display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.85);align-items:center;justify-content:center;padding:20px" onclick="if(event.target.id==='qlbx')qlbxClose()">
  <div style="position:absolute;top:14px;right:20px;display:flex;gap:10px;align-items:center;z-index:2">
    <span id="qlbx-name" style="color:#fff;font-size:13px;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <button type="button" onclick="qlbxClose()" style="background:#fff;border:none;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer">✕ Đóng</button>
  </div>
  <div id="qlbx-body" style="max-width:94vw;max-height:90vh;display:flex;align-items:center;justify-content:center"></div>
</div>
<script>
function previewFile(url,name,mime){
  var b=document.getElementById('qlbx-body'), n=document.getElementById('qlbx-name');
  n.textContent=name||'';
  var ext=(url.split('?')[0].split('.').pop()||'').toLowerCase();
  var isImg=(mime||'').indexOf('image/')===0 || ['jpg','jpeg','png','webp','gif','bmp'].indexOf(ext)>=0;
  var isPdf=(mime||'')==='application/pdf' || ext==='pdf';
  if(isImg) b.innerHTML='<img src="'+url+'" style="max-width:94vw;max-height:90vh;border-radius:6px;box-shadow:0 6px 40px rgba(0,0,0,.6)">';
  else if(isPdf) b.innerHTML='<iframe src="'+url+'" style="width:92vw;height:88vh;border:none;background:#fff;border-radius:6px"></iframe>';
  else b.innerHTML='<div style="background:#fff;padding:26px;border-radius:8px;font-size:14px">Không xem trước được. <a href="'+url+'" target="_blank">Mở file</a></div>';
  document.getElementById('qlbx').style.display='flex';
}
function qlbxClose(){ document.getElementById('qlbx').style.display='none'; document.getElementById('qlbx-body').innerHTML=''; }
document.addEventListener('keydown',function(e){ if(e.key==='Escape') qlbxClose(); });
</script>
</body>
