{% if user %}
<script>
window.currentUsername       = {{ (user.ten_dang_nhap or '') | tojson }};
window.currentUserDisplayName = {{ (user.ho_ten or user.ten_dang_nhap or 'Tôi') | tojson }};
</script>
{% endif %}
<link rel="stylesheet" href="/static/css/chat_widget.css?v=20260828-deb79e">
<!-- ZALO V2 widget HTML -->
<div id="_chat_widget_root">

  <!-- FAB (giữ ID #_chat_fab cho base.html) -->
  <button id="_chat_fab" type="button" aria-label="Mở chat Papasan"
          title="Bấm để mở chat — kéo để đổi chỗ (hoặc phím mũi tên khi nút đang chọn)">
    {# Icon bong bóng chat = SVG inline (không icon font, không CDN — hợp lệ
       với design system). Icon cũ là entity &#...; từng bị regex thay màu phá. #}
    <span class="zV2_fab_icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3.2c-4.9 0-8.8 3.4-8.8 7.6 0 2.1 1 4 2.6 5.4-.2 1-.6 2.1-1.4 2.9-.1.1 0 .3.1.3 1.6-.1 3.1-.7 4.2-1.4 1 .3 2.1.4 3.3.4 4.9 0 8.8-3.4 8.8-7.6S16.9 3.2 12 3.2z" fill="#fff"/><circle cx="8.2" cy="10.8" r="1.1" fill="var(--z-blue, #0084FF)"/><circle cx="12" cy="10.8" r="1.1" fill="var(--z-blue, #0084FF)"/><circle cx="15.8" cy="10.8" r="1.1" fill="var(--z-blue, #0084FF)"/></svg></span>
    <span class="zV2_fab_badge" id="_chat_fab_badge">0</span>
  </button>

  <!-- PANEL 3 cột -->
  <div id="_chat_panel" role="dialog" aria-label="Chat Papasan">

    <!-- LEFT RAIL -->
    <aside id="zV2_rail">
      <div id="zV2_rail_logo" title="Papasan Chat"><img src="/static/papasan_icon_1024.png" alt="Papasan" style="width:100%;height:100%;object-fit:contain;" /></div>

      <button type="button" class="zV2_rail_btn active" id="zV2_rail_btn_tin" data-tab="tin-nhan" aria-label="Tin nhắn">
        <span class="zV2_rail_icon">Tin nhắn</span>
        <span class="zV2_rail_badge" id="zV2_rail_badge_tin">0</span>
        <span class="zV2_rail_tooltip">Tin nhắn</span>
      </button>

      <button type="button" class="zV2_rail_btn" id="zV2_rail_btn_danhba" data-tab="danh-ba" aria-label="Danh bạ">
        <span class="zV2_rail_icon">Danh bạ</span>
        <span class="zV2_rail_tooltip">Danh bạ</span>
      </button>

      <div id="zV2_rail_spacer"></div>
    </aside>

    <!-- MIDDLE COLUMN -->
    <section id="zV2_col_middle">
      <header id="zV2_mid_header">
        <div id="zV2_mid_header_avatar">U</div>
        <div id="zV2_mid_header_name">Papasan</div>
        <button type="button" id="zV2_btn_new_group" title="Tạo nhóm mới" aria-label="Tạo nhóm mới">+</button>
      </header>

      <div id="zV2_search_wrap">
        <input type="text" id="zV2_search_box" placeholder="Tìm cuộc trò chuyện..." autocomplete="off" />
      </div>

      <div id="zV2_tabs_filter">
        <button type="button" class="zV2_tab_filter_btn active" data-filter="all">Tất cả</button>
        <button type="button" class="zV2_tab_filter_btn" data-filter="unread">Chưa đọc</button>
      </div>

      <div id="zV2_conv_list" role="list" aria-label="Danh sách cuộc trò chuyện">
        <div id="zV2_empty_list" class="zV2_empty_list_msg">Đang tải...</div>
      </div>

      <div id="zV2_contacts_list" role="list" aria-label="Danh bạ"></div>
    </section>

    <!-- MAIN COLUMN -->
    <section id="zV2_col_main">

      <!-- Empty state -->
      <div id="zV2_empty_main">
        <div class="zV2_empty_title">Chào mừng đến Chat Papasan!</div>
        <div class="zV2_empty_sub">Chọn cuộc trò chuyện hoặc Danh bạ để bắt đầu.</div>
      </div>

      <!-- Chat surface (hidden until a room is opened) -->
      <header id="zV2_main_header" style="display:none;">
        <button type="button" id="zV2_main_back_btn" aria-label="Quay lại">&#8249;</button>
        <div id="zV2_main_avatar">?</div>
        <div id="zV2_main_titlewrap">
          <div id="zV2_main_title">—</div>
          <div id="zV2_main_meta">—</div>
        </div>
        <div id="zV2_main_actions">
          <button type="button" class="zV2_main_action_btn" id="zV2_btn_msg_search" title="Tìm tin nhắn" aria-label="Tìm tin nhắn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          <button type="button" class="zV2_main_action_btn" id="zV2_btn_call" title="Gọi thoại" aria-label="Gọi thoại"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
          <button type="button" class="zV2_main_action_btn" id="zV2_btn_video" title="Gọi video" aria-label="Gọi video"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
          <button type="button" class="zV2_main_action_btn" id="zV2_btn_info" title="Thông tin" aria-label="Thông tin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button>
        </div>
      </header>

      <!-- Search bar (toggled by zV2_btn_msg_search) -->
      <div id="zV2_msg_search_bar" role="search" aria-label="Tìm tin nhắn trong chat">
        <svg class="zV2_msg_search_icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="zV2_msg_search_input" placeholder="Tìm trong cuộc trò chuyện..." autocomplete="off" />
        <span id="zV2_msg_search_count" class="zV2_msg_search_count">0/0</span>
        <button type="button" id="zV2_msg_search_prev" class="zV2_msg_search_nav" title="Trước (Shift+Enter)" aria-label="Kết quả trước">&#8593;</button>
        <button type="button" id="zV2_msg_search_next" class="zV2_msg_search_nav" title="Sau (Enter)" aria-label="Kết quả sau">&#8595;</button>
        <button type="button" id="zV2_msg_search_close" class="zV2_msg_search_close" title="Đóng (Esc)" aria-label="Đóng tìm kiếm">&times;</button>
      </div>

      <div id="zV2_messages_scroll" style="display:none;">
        <div id="zV2_messages_inner"></div>
      </div>

      <div id="zV2_typing_indicator" aria-live="polite">
        <span class="zV2_typing_text">Đang nhập</span>
        <span class="zV2_dot"></span>
        <span class="zV2_dot"></span>
        <span class="zV2_dot"></span>
      </div>

      <button type="button" id="zV2_scroll_bottom_btn" aria-label="Cuộn xuống cuối">
        &#8595;
        <span class="zV2_scroll_badge" id="zV2_scroll_badge">0</span>
      </button>

      <div id="zV2_reply_strip" aria-live="polite">
        <span class="zV2_reply_bar"></span>
        <div class="zV2_reply_body">
          <div class="zV2_reply_to" id="zV2_reply_to">Trả lời —</div>
          <div class="zV2_reply_text" id="zV2_reply_text">—</div>
        </div>
        <button type="button" class="zV2_reply_close" id="zV2_reply_close_btn" aria-label="Huỷ trả lời">&times;</button>
      </div>

      <div id="zV2_compose_wrap" style="display:none;">
        <!-- Paste image preview -->
        <div id="zV2_paste_preview">
          <img id="zV2_paste_thumb" src="" alt="" />
          <div id="zV2_paste_meta">
            <div id="zV2_paste_name"></div>
            <div id="zV2_paste_hint">Nhấn Enter hoặc nút Gửi để gửi ảnh</div>
          </div>
          <button id="zV2_paste_clear" type="button" title="Xoá">✕</button>
        </div>
        <div id="zV2_compose_tools">
          <button type="button" class="zV2_compose_tool_btn" id="zV2_btn_emoji" title="Cảm xúc" aria-label="Cảm xúc"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
          <button type="button" class="zV2_compose_tool_btn" id="zV2_btn_sticker" title="Sticker" aria-label="Sticker"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg></button>
          <button type="button" class="zV2_compose_tool_btn" id="zV2_btn_image" title="Ảnh" aria-label="Ảnh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
          <button type="button" class="zV2_compose_tool_btn" id="zV2_btn_file" title="File đính kèm" aria-label="File đính kèm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
          <button type="button" class="zV2_compose_tool_btn" id="zV2_btn_mic" title="Ghi âm" aria-label="Ghi âm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
          <input type="file" id="zV2_image_input" accept="image/*" style="display:none" />
          <input type="file" id="zV2_file_input" style="display:none" />
        </div>
        <div id="zV2_compose_row">
          <textarea id="zV2_compose_input" rows="1" placeholder="Nhập tin nhắn..." aria-label="Nhập tin nhắn"></textarea>
          <div id="zV2_compose_send_wrap">
            <button type="button" id="zV2_thumbs_btn" aria-label="Gửi like"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66-.23-.45-.52-.86-.88-1.22L14 2 7.59 8.41C7.21 8.79 7 9.3 7 9.83v7.84C7 18.95 8.05 20 9.34 20h8.11c.7 0 1.36-.37 1.72-.97l2.66-6.15z"/></svg></button>
            <button type="button" id="zV2_send_btn" aria-label="Gửi tin nhắn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
          </div>
        </div>
      </div>

      <!-- INFO PANEL (slide-in inside main column) -->
      <aside id="zV2_info_panel" aria-label="Thông tin cuộc trò chuyện">
        <header id="zV2_info_header">
          <div id="zV2_info_title">Thông tin</div>
          <button type="button" id="zV2_info_close_btn" aria-label="Đóng">&times;</button>
        </header>
        <nav id="zV2_info_tabs">
          <button type="button" class="zV2_info_tab_btn active" data-info-tab="info">Thông tin</button>
          <button type="button" class="zV2_info_tab_btn" data-info-tab="members">Thành viên</button>
          <button type="button" class="zV2_info_tab_btn" data-info-tab="media">Ảnh-Video</button>
          <button type="button" class="zV2_info_tab_btn" data-info-tab="files">File</button>
        </nav>
        <div id="zV2_info_body">
          <div class="zV2_info_tab_panel active" data-info-panel="info"></div>
          <div class="zV2_info_tab_panel" data-info-panel="members"></div>
          <div class="zV2_info_tab_panel" data-info-panel="media"></div>
          <div class="zV2_info_tab_panel" data-info-panel="files"></div>
        </div>
      </aside>

      <!-- Thread panel (hội thoại độc lập) -->
      <div id="zV2_thread_panel">
        <div id="zV2_thread_header">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Hội thoại
          <button id="zV2_thread_close" title="Đóng">✕</button>
        </div>
        <div id="zV2_thread_root_wrap"></div>
        <div id="zV2_thread_scroll"></div>
        <div id="zV2_thread_compose_wrap">
          <textarea id="zV2_thread_input" placeholder="Trả lời hội thoại..." rows="1"></textarea>
          <button id="zV2_thread_send_btn" title="Gửi">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

    </section>

    <!-- Close panel button -->
    <button type="button" id="zV2_panel_close_btn" aria-label="Đóng cửa sổ chat">&times;</button>
  </div>
</div>
