<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt Đề Nghị TT — Kế Toán</title>
<link rel="icon" href="/static/icon/favicon.ico">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--brand-soft);color:var(--text-1);font-size:14px}
  .container{max-width:1400px;margin:24px auto;padding:0 16px}
  .summary{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .stat{background:#fff;padding:14px 20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:140px;cursor:pointer;transition:all .15s}
  .stat:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
  .stat.active{outline:2px solid var(--brand-hover)}
  .stat .label{color:var(--text-2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  .stat .value{font-size:22px;font-weight:700;color:var(--brand-hover);margin-top:4px}
  .stat.cho_duyet .value{color:var(--warning)}
  .stat.kt_duyet .value{color:var(--info)}
  .stat.duyet .value{color:var(--success)}
  .stat.kt_tu_choi .value, .stat.tu_choi .value{color:#dc2626}
  .card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
  .card-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;gap:10px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bg-page);font-size:13px;vertical-align:top}
  th{background:var(--bg-page);color:var(--text-2);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  tr:hover td{background:var(--bg-page)}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
  .b-cho_duyet{background:#fef3c7;color:#92400e}
  .b-kt_duyet{background:var(--info-soft);color:var(--info-fg)}
  .b-duyet{background:var(--success-soft);color:var(--success-fg)}
  .b-kt_tu_choi,.b-tu_choi{background:#fee2e2;color:#991b1b}
  .money{font-variant-numeric:tabular-nums;color:var(--brand-hover);font-weight:600;text-align:right}
  .btn{display:inline-block;padding:6px 12px;border-radius:6px;border:none;font-size:12px;cursor:pointer;font-weight:500;margin-right:4px;transition:all .15s}
  .btn-ok{background:var(--success);color:#fff}
  .btn-ok:hover{background:var(--success-fg)}
  .btn-no{background:#dc2626;color:#fff}
  .btn-no:hover{background:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .empty{padding:60px 20px;text-align:center;color:var(--text-2);font-style:italic}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px}
  .modal.open{display:flex}
  .modal-box{background:#fff;border-radius:10px;max-width:500px;width:100%;padding:20px}
  .modal-box h3{margin-bottom:12px;color:var(--brand-hover)}
  .modal-box .info{background:var(--bg-page);padding:10px;border-radius:6px;margin-bottom:14px;font-size:13px}
  .modal-box textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;min-height:80px;resize:vertical}
  .modal-box .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .btn-cancel{background:var(--border);color:var(--text-2)}
  .ghi-chu-cell{max-width:200px;color:var(--text-2);font-size:12px;line-height:1.4}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media (max-width:768px){
    body{overflow-x:hidden}
    .container{margin:14px auto;padding:0 12px}
    .summary{gap:8px}
    .stat{min-width:120px;flex:1 1 45%;padding:12px 14px}
    .table-scroll table{min-width:960px}
    th{padding:8px 10px;font-size:11px}
    td{padding:8px 10px;font-size:12px}
  }
</style>
</head>
<body>
{% include "_header.html" %}


<div class="container">

  <div class="summary" id="summary">
    <div class="stat active" data-filter=""><div class="label">Tất cả</div><div class="value" id="cnt-all">—</div></div>
    <div class="stat cho_duyet" data-filter="cho_duyet"><div class="label">Chờ KT duyệt</div><div class="value" id="cnt-cho_duyet">—</div></div>
    <div class="stat kt_duyet" data-filter="kt_duyet"><div class="label">Đã KT duyệt, chờ CEO</div><div class="value" id="cnt-kt_duyet">—</div></div>
    <div class="stat duyet" data-filter="duyet"><div class="label">CEO đã duyệt</div><div class="value" id="cnt-duyet">—</div></div>
    <div class="stat kt_tu_choi" data-filter="kt_tu_choi"><div class="label">KT từ chối</div><div class="value" id="cnt-kt_tu_choi">—</div></div>
    <div class="stat tu_choi" data-filter="tu_choi"><div class="label">CEO từ chối</div><div class="value" id="cnt-tu_choi">—</div></div>
  </div>

  <div class="card">
    <div class="card-header">Danh sách <span id="filter-label" style="color:var(--text-2);font-weight:500;font-size:13px"></span></div>
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Ngày ĐN</th>
          <th>Mã đơn</th>
          <th>ĐVVC</th>
          <th>Số tiền</th>
          <th>Lý do</th>
          <th>Người tạo</th>
          <th>Trạng thái</th>
          <th>KT duyệt</th>
          <th>CEO duyệt</th>
          <th style="text-align:center">Hành động</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="11" class="empty">Đang tải…</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>

<!-- Modal duyệt -->
<div class="modal" id="modal-approve">
  <div class="modal-box">
    <h3>Kế Toán Duyệt</h3>
    <div class="info" id="approve-info"></div>
    <label style="display:block;margin-bottom:6px;font-size:12px;color:var(--text-2)">Ghi chú (tùy chọn)</label>
    <textarea id="approve-note" placeholder="VD: Đã đối chiếu chứng từ, hợp lệ"></textarea>
    <div class="actions">
      <button class="btn btn-cancel" onclick="closeModals()">Hủy</button>
      <button class="btn btn-ok" id="approve-submit">Duyệt</button>
    </div>
  </div>
</div>

<!-- Modal từ chối -->
<div class="modal" id="modal-reject">
  <div class="modal-box">
    <h3>Kế Toán Từ Chối</h3>
    <div class="info" id="reject-info"></div>
    <label style="display:block;margin-bottom:6px;font-size:12px;color:var(--text-2)">Lý do <span style="color:#dc2626">*</span></label>
    <textarea id="reject-reason" placeholder="VD: Số tiền không khớp chứng từ" required></textarea>
    <div class="actions">
      <button class="btn btn-cancel" onclick="closeModals()">Hủy</button>
      <button class="btn btn-no" id="reject-submit">Từ chối</button>
    </div>
  </div>
</div>

<script>
let currentFilter = '';
let allRows = [];
let actionId = null;

const STATUS_LABEL = {
  cho_duyet: 'Chờ KT',
  kt_duyet: 'Chờ CEO',
  duyet: 'Hoàn tất',
  kt_tu_choi: 'KT từ chối',
  tu_choi: 'CEO từ chối',
};

function fmtVnd(n){
  if(n == null) return '—';
  return Number(n).toLocaleString('vi-VN') + 'đ';
}
function fmtDate(s){
  if(!s) return '—';
  return s.slice(0,10).split('-').reverse().join('/');
}
function fmtDt(s){
  if(!s) return '—';
  const d = new Date(s);
  return d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'});
}
function esc(s){
  return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

async function loadSummary(){
  try{
    const r = await fetch('/api/de-nghi-tt/summary', {credentials:'include'});
    if(!r.ok) return;
    const data = await r.json();
    let total = 0;
    ['cho_duyet','kt_duyet','duyet','kt_tu_choi','tu_choi'].forEach(k => {
      const n = data[k] || 0;
      document.getElementById('cnt-'+k).textContent = n;
      total += n;
    });
    document.getElementById('cnt-all').textContent = total;
  }catch(e){console.error(e)}
}

async function loadList(){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '<tr><td colspan="11" class="empty">Đang tải…</td></tr>';
  try{
    const url = currentFilter ? `/api/de-nghi-tt?trang_thai=${currentFilter}` : '/api/de-nghi-tt';
    const r = await fetch(url, {credentials:'include'});
    if(!r.ok){
      tbody.innerHTML = `<tr><td colspan="11" class="empty">Lỗi: ${r.status} ${esc(await r.text())}</td></tr>`;
      return;
    }
    allRows = await r.json();
    render();
  }catch(e){
    tbody.innerHTML = `<tr><td colspan="11" class="empty">Lỗi mạng: ${esc(e.message)}</td></tr>`;
  }
}

function render(){
  const tbody = document.getElementById('tbody');
  if(allRows.length === 0){
    tbody.innerHTML = '<tr><td colspan="11" class="empty">Không có đề nghị nào.</td></tr>';
    return;
  }
  tbody.innerHTML = allRows.map(r => {
    const canAct = r.trang_thai === 'cho_duyet';
    const actions = canAct
      ? `<button class="btn btn-ok" onclick="openApprove('${r.id}')">Duyệt</button>
         <button class="btn btn-no" onclick="openReject('${r.id}')">Từ chối</button>`
      : `<span style="color:var(--text-3);font-size:11px">—</span>`;
    const kt = r.kt_duyet_boi
      ? `<div>${esc(r.kt_duyet_boi)}</div><div style="color:var(--text-3);font-size:11px">${fmtDt(r.kt_duyet_luc)}</div>${r.kt_ghi_chu ? `<div class="ghi-chu-cell">${esc(r.kt_ghi_chu)}</div>` : ''}`
      : '—';
    const ceo = r.nguoi_duyet
      ? `<div>${esc(r.nguoi_duyet)}</div><div style="color:var(--text-3);font-size:11px">${fmtDt(r.ngay_duyet)}</div>`
      : '—';
    return `<tr>
      <td><b>${esc(r.id)}</b></td>
      <td>${fmtDate(r.ngay_de_nghi)}</td>
      <td>${esc(r.ma_don||'')}</td>
      <td>${esc(r.don_vi_vc||'')}</td>
      <td class="money">${fmtVnd(r.so_tien)}</td>
      <td class="ghi-chu-cell">${esc(r.ly_do||'')}</td>
      <td>${esc(r.nguoi_tao||'')}</td>
      <td><span class="badge b-${r.trang_thai}">${STATUS_LABEL[r.trang_thai]||r.trang_thai}</span></td>
      <td>${kt}</td>
      <td>${ceo}</td>
      <td style="text-align:center">${actions}</td>
    </tr>`;
  }).join('');
}

function openApprove(id){
  const r = allRows.find(x => x.id === id);
  if(!r) return;
  actionId = id;
  document.getElementById('approve-info').innerHTML =
    `<b>${esc(id)}</b> — ĐVVC ${esc(r.don_vi_vc||'')} — <b class="money">${fmtVnd(r.so_tien)}</b><br>Lý do: ${esc(r.ly_do||'—')}`;
  document.getElementById('approve-note').value = '';
  document.getElementById('modal-approve').classList.add('open');
}

function openReject(id){
  const r = allRows.find(x => x.id === id);
  if(!r) return;
  actionId = id;
  document.getElementById('reject-info').innerHTML =
    `<b>${esc(id)}</b> — ĐVVC ${esc(r.don_vi_vc||'')} — <b class="money">${fmtVnd(r.so_tien)}</b>`;
  document.getElementById('reject-reason').value = '';
  document.getElementById('modal-reject').classList.add('open');
}

function closeModals(){
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('open'));
  actionId = null;
}

async function submitApprove(){
  if(!actionId) return;
  const btn = document.getElementById('approve-submit');
  btn.disabled = true;
  try{
    const r = await fetch(`/api/de-nghi-tt/${actionId}/kt-approve`, {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({kt_ghi_chu: document.getElementById('approve-note').value || null}),
    });
    if(!r.ok){
      alert('Lỗi: ' + r.status + ' ' + await r.text());
      return;
    }
    closeModals();
    await Promise.all([loadSummary(), loadList()]);
  }finally{
    btn.disabled = false;
  }
}

async function submitReject(){
  if(!actionId) return;
  const reason = document.getElementById('reject-reason').value.trim();
  if(!reason){ alert('Vui lòng nhập lý do từ chối'); return; }
  const btn = document.getElementById('reject-submit');
  btn.disabled = true;
  try{
    const r = await fetch(`/api/de-nghi-tt/${actionId}/kt-reject`, {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ly_do: reason}),
    });
    if(!r.ok){
      alert('Lỗi: ' + r.status + ' ' + await r.text());
      return;
    }
    closeModals();
    await Promise.all([loadSummary(), loadList()]);
  }finally{
    btn.disabled = false;
  }
}

// Filter buttons
document.querySelectorAll('.stat').forEach(s => {
  s.addEventListener('click', () => {
    document.querySelectorAll('.stat').forEach(x => x.classList.remove('active'));
    s.classList.add('active');
    currentFilter = s.dataset.filter;
    document.getElementById('filter-label').textContent =
      currentFilter ? `(lọc: ${STATUS_LABEL[currentFilter] || currentFilter})` : '(tất cả)';
    loadList();
  });
});

// Submit buttons
document.getElementById('approve-submit').addEventListener('click', submitApprove);
document.getElementById('reject-submit').addEventListener('click', submitReject);

// Close modal khi click overlay
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if(e.target === m) closeModals(); });
});

// Init
loadSummary();
loadList();
</script>

</body>
</html>
