<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập — Papasan Kế Toán</title>
<link rel="icon" type="image/png" href="/static/papasan_icon_1024.png">
<link rel="shortcut icon" href="/static/papasan.ico">
<!-- PWA meta — bắt buộc cho iOS "Add to Home Screen" mở fullscreen (ẩn URL bar) -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1a3c5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kế Toán">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0a2340 0%,#1a3a6e 50%,#2255a4 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.3);width:100%;max-width:420px;overflow:hidden}
.login-header{background:linear-gradient(135deg,#0a2340,#1a3a6e);color:#fff;padding:32px;text-align:center}
.login-header .logo{font-size:26px;font-weight:900;letter-spacing:2px}
.login-header .dept{font-size:13px;opacity:.8;margin-top:4px;letter-spacing:1px}
.login-header .icon{font-size:44px;margin-bottom:12px}
.login-body{padding:32px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.form-control{width:100%;padding:11px 14px;border:1.5px solid #dde1ea;border-radius:9px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-control:focus{border-color:#1a3a6e;box-shadow:0 0 0 3px rgba(26,58,110,.12)}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#1a3a6e,#2255a4);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:6px;letter-spacing:.5px}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.error-msg{background:#fdecea;color:#c0392b;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:18px}
.footer{margin-top:24px;font-size:11px;color:rgba(255,255,255,.6);text-align:center}

/* Responsive */
@media(max-width:480px){
  body{padding:16px}
  .login-card{max-width:100%;border-radius:12px}
  .login-header{padding:24px 18px}
  .login-header .icon{font-size:36px;margin-bottom:8px}
  .login-header .logo{font-size:22px;letter-spacing:1.5px}
  .login-header .dept{font-size:12px}
  .login-body{padding:22px 18px}
  .form-group{margin-bottom:14px}
  .form-control{padding:11px 12px;font-size:14px;min-height:42px}
  .btn-login{padding:13px;font-size:15px;min-height:44px}
  .footer{margin-top:18px;font-size:10.5px;padding:0 12px}
}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="icon">💰</div>
    <div class="logo" style="display:flex;justify-content:center;align-items:center;padding:8px 0">
      <img src="https://papasanvietnam.vn/wp-content/uploads/2025/11/Ch%C6%B0a-c%C3%B3-t%C3%AAn-250-x-67-px-2.png"
           alt="Papasan Việt Nam"
           style="max-width:220px;height:auto;background:#fff;padding:8px 12px;border-radius:8px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.08)"
           onerror="this.outerHTML='PAPASAN'">
    </div>
    <div class="dept">Phòng Kế Toán — Tài Chính</div>
  </div>
  <div class="login-body">
    {% if error %}<div class="error-msg">⚠ {{ error }}</div>{% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input class="form-control" type="text" name="username" placeholder="Nhập tài khoản..." autofocus>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input class="form-control" type="password" name="password" placeholder="Nhập mật khẩu...">
      </div>
      <button class="btn-login" type="submit">Đăng nhập</button>
    </form>
  </div>
</div>
<div class="footer">Papasan &copy; 2026 — Kế Toán Nội Bộ</div>
</body>
</html>
