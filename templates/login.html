<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── MÀU LẤY TỪ BẢN THIẾT KẾ ───────────────────────────────────────────────
   Không ước lượng bằng mắt: mọi giá trị dưới đây đo thẳng từ feqr.pdf — màu
   nền thẻ lấy mẫu pixel theo từng 10% chiều cao, màu nút/chữ/viền đọc từ đối
   tượng vẽ trong PDF.

   Trang đăng nhập cố ý ĐỨNG NGOÀI hệ token hổ phách của app: nền thẻ là
   gradient riêng, không token nào trong theme.css tả được. Các giá trị này
   CHỈ sống trong file này, không rò ra phần còn lại của app. */
:root{
  --lg-page:  #F7F7F7;      /* đúng màu mép ảnh nền, đo bằng Pillow */

  /* DẢI 3 MÀU — điểm dừng 0/50/100%, không phải 4 chặng như bản trước.
     Kiểm lại bằng cách nội suy: giữa 0% và 50% tại 20% ra #BD7823, mẫu đo
     được #BE7822; tại 80% ra #281000, mẫu đo #281000 — khớp. Đây là gradient
     3 chặng thật, đừng thêm chặng phụ vào giữa. */
  --lg-ramp-hi:  #F9AE3A;
  --lg-ramp-mid: #632800;
  --lg-ramp-lo:  #000000;
  --lg-card: linear-gradient(180deg,
               var(--lg-ramp-hi)  0%,
               var(--lg-ramp-mid) 50%,
               var(--lg-ramp-lo)  100%);

  /* Nút là MÀU PHẲNG #FBB03B, không phải gradient — đo cả 3 điểm đỉnh/giữa/đáy
     đều ra một giá trị. Chữ nút #672A00 đọc thẳng từ PDF. */
  --lg-btn:     #FBB03B;
  --lg-btn-ink: #672A00;

  /* Bản thiết kế khai MỌI dòng chữ trên thẻ là #FFFFFF — kể cả dòng mô tả nhỏ
     và dòng chân thẻ. Trắng đặc trên nền cam cũng là mức tương phản CAO NHẤT
     có thể, hạ độ mờ chỉ làm tệ đi. */
  --lg-ink-1: #FFFFFF;
  --lg-ink-2: #FFFFFF;
  --lg-ink-3: #FFFFFF;
  --lg-ink-title: #FFFFFF;

  /* Ô nhập KHÔNG có nền — chỉ một đường viền trắng. Đã kiểm: ruột ô và nền thẻ
     ngay cạnh nó cùng ra #642900. Đổ nền tối vào là sai bản thiết kế. */
  --lg-field: transparent;
  /* Viền trong PDF là trắng đặc dày 1 đơn vị trên khung 3840 — quy về khung
     1920 chỉ còn nửa pixel. Nên ở CSS dùng 1px với độ mờ ~.45 để ra đúng độ
     đậm mắt nhìn thấy; để trắng đặc 1px sẽ đậm gấp đôi bản thiết kế. */
  --lg-line:  rgba(255,255,255,.45);
  --lg-ring:  0 0 0 3px rgba(250,175,58,.40);
  --lg-err:   #FFB4A6;
}

html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  background:var(--lg-page);
  color:var(--lg-ink-1);
  -webkit-font-smoothing:antialiased;
}

/* DESKTOP: ảnh phủ TOÀN màn, thẻ nổi lên trên và lệch phải.
   Khung của bản thiết kế là 3840×2200 — đúng bằng tỉ lệ ảnh gốc (1,745), tức
   bản thiết kế cho ảnh hiện TRỌN VẸN, không cắt. Màn 16:9 (1,78) chỉ lệch 2%
   nên `cover` gần như không xén gì; cửa sổ càng hẹp thì càng xén hai bên, đó
   là lúc ảnh trông "phóng to" — không sửa được bằng CSS, chỉ có cách giữ thẻ
   đủ lớn để cân lại.
   32% chứ KHÔNG phải center: `cover` cắt bớt cạnh dài, để center thì khối tròn
   vàng (ở ~31% chiều ngang ảnh) bị cắt mất mép trái trên màn hẹp/cao. */
.lg-stage{
  display:flex;align-items:center;justify-content:flex-end;
  min-height:100vh;min-height:100dvh;
  background:var(--lg-page) url('/static/login_bg.webp?v=baa970d3') 32% center/cover no-repeat;
}

/* Bề ngang thẻ và lề phải LÀ số đo của bản thiết kế:
       thẻ 1293/3840 = 33,7% bề ngang khung
       lề phải 245/3840 = 6,4%
   ⇒ tâm thẻ ở 100 − 6,4 − 33,7/2 = 76,8%, đúng bằng bản thiết kế.
   Đặt bề ngang lên .lg-panel (không phải .lg-card) để hai số này cộng thẳng
   với nhau; thẻ chỉ việc rộng 100% của panel. min/max chặn hai đầu: dưới
   390px thì chữ vỡ, trên 760px thì thẻ to lố trên màn siêu rộng. */
.lg-panel{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  padding:24px 0;
  width:33.7%;min-width:390px;max-width:760px;
  margin-right:6.4%;
}

/* ── THẺ ────────────────────────────────────────────────────────────────────
   MỌI kích thước bên trong thẻ tính bằng `em`, và `em` neo vào font-size của
   chính thẻ. Nhờ vậy đổi đúng MỘT dòng font-size là cả thẻ phóng to/thu nhỏ
   đồng bộ, không phải sửa 20 chỗ rời rạc.
   Gốc quy đổi: bản thiết kế để nhãn ô nhập = 2,61% bề ngang thẻ. Thẻ rộng
   33,7vw ⇒ nhãn = 0,88vw. Lấy luôn cỡ nhãn làm 1em, mọi cỡ khác suy ra từ đó
   (tiêu đề 2,31em, "Đăng nhập" 1,64em… — đều là tỉ lệ đo từ PDF).
   Khoảng cách dọc để riêng thành biến vì MOBILE phải bóp chặt hơn desktop:
   bố cục thiết kế rất thoáng, giữ nguyên trên điện thoại thì thẻ cao 659px,
   che mất khối tròn vàng ở đáy ảnh. */
.lg-card{
  width:100%;
  /* --lg-fs là ĐỘ DÀI TUYỆT ĐỐI (px/vw), không phải em. Đây không phải chuyện
     phong cách mà là chỗ từng sai: nếu khai khoảng cách bằng `em`, biến chỉ là
     một chuỗi token nên `em` sẽ tính theo font-size của PHẦN TỬ DÙNG NÓ, không
     phải của thẻ. Nút có font-size 1,64em nên `height:3.95em` ra 109px thay vì
     67px. Nhân với --lg-fs thì mọi chỗ quy về cùng một gốc. */
  --lg-fs:clamp(12.5px,.88vw,20px);
  font-size:var(--lg-fs);

  /* Khoảng cách dọc = tỉ lệ đo từ bản thiết kế × 1,217. Vì sao phải nhân:
     bố cục thiết kế dùng font Noto Sans, còn trang này dùng font hệ thống —
     chữ cao hơn nên nếu giữ nguyên khoảng cách thì thẻ chỉ cao 825px thay vì
     902px (75% màn thay vì 82%). Hệ số 1,217 giải ngược từ chiều cao đích,
     không phải ước lượng. Đổi cỡ chữ thì phải giải lại. */
  --lg-pad-top:calc(var(--lg-fs)*2.96);
  --lg-pad-bot:calc(var(--lg-fs)*3.63);
  --lg-pad-x:calc(var(--lg-fs)*2.76);
  --lg-gap-logo:calc(var(--lg-fs)*2.45);
  --lg-gap-h2:calc(var(--lg-fs)*3.12);
  --lg-gap-group:calc(var(--lg-fs)*3.63);
  --lg-gap-group2:calc(var(--lg-fs)*2.74);
  --lg-gap-remember:calc(var(--lg-fs)*2.62);
  --lg-gap-btn:calc(var(--lg-fs)*2.24);
  --lg-gap-foot:calc(var(--lg-fs)*2.29);
  --lg-h-input:calc(var(--lg-fs)*3.2);
  --lg-h-btn:calc(var(--lg-fs)*3.95);

  background:var(--lg-card);
  border-radius:calc(var(--lg-fs)*.72);              /* 24/1293 bề ngang thẻ, đo ở góc trên trái */
  /* Bóng BA lớp, không phải một. Bản thiết kế có bóng vừa toả rộng vừa đậm sát
     mép — một lớp chỉ làm được một trong hai: blur lớn thì mép thẻ nhạt nhoà,
     blur nhỏ thì thành viền cứng. Bóng ám NÂU chứ không đen thuần: thẻ nâu-cam
     mà đổ bóng xám thì chỗ tiếp giáp bị xỉn, rõ nhất ở hai góc trên. */
  box-shadow:
    0 34px 80px -12px rgba(30,15,2,.34),
    0 14px 34px -8px  rgba(30,15,2,.30),
    0 3px 10px        rgba(30,15,2,.20);
  padding:var(--lg-pad-top) var(--lg-pad-x) var(--lg-pad-bot);
}

.lg-logo{display:flex;justify-content:center;margin-bottom:var(--lg-gap-logo)}
/* Wordmark gốc là cam-nâu, trên nền thẻ tối nó chìm gần hết. brightness(0) dìm
   mọi pixel về đen rồi invert(1) lật thành TRẮNG ĐẶC, giữ nguyên vùng trong
   suốt. Đây là cách duy nhất tô trắng một file PNG bằng CSS.
   Đặt theo CHIỀU CAO (3,5em = 6,6% chiều cao thẻ, đo từ bản thiết kế) chứ
   không theo bề ngang — bề ngang còn phụ thuộc phần chữ nhỏ dưới wordmark. */
.lg-logo img{height:3.5em;width:auto;max-width:100%;object-fit:contain;
             filter:brightness(0) invert(1)}

.lg-title{
  /* 1,85em chứ không phải 2,31em của bản thiết kế. Bản thiết kế đặt tiêu đề
     vừa TRÒN MỘT DÒNG lấp đầy bề ngang thẻ — nhưng họ dùng Noto Sans, hẹp hơn
     font hệ thống ở đây. Đo thử cả 8 tên: cỡ lớn nhất mà tên DÀI NHẤT
     ("HỆ THỐNG QUẢN LÝ KINH DOANH") còn giữ 1 dòng là 1,88em. Lấy 1,85em cho
     dư chút phòng máy thiếu Segoe UI phải dùng font thay thế.
     Để 2,31em thì 6/8 app tiêu đề rớt xuống 2 dòng, thẻ cao vống lên. */
  font-size:1.85em;font-weight:800;letter-spacing:.2px;line-height:1.15;
  text-align:center;color:var(--lg-ink-title);
  padding-bottom:calc(var(--lg-fs)*1.12);
  border-bottom:1px solid rgba(255,255,255,.55);
}

.lg-h2{font-size:1.64em;font-weight:800;color:var(--lg-ink-1);
       margin-top:var(--lg-gap-h2);line-height:1.2}
.lg-hint{font-size:.97em;color:var(--lg-ink-3);margin-top:calc(var(--lg-fs)*.47);line-height:1.4}

.lg-group{margin-top:var(--lg-gap-group2)}
/* Khoảng thở giữa cụm giới thiệu và ô nhập đầu tiên rộng hơn khoảng giữa hai ô
   — bản thiết kế để vậy cho mắt tách được "phần giới thiệu" với "phần điền" */
form .lg-group:first-of-type{margin-top:var(--lg-gap-group)}
.lg-group label{display:block;font-size:1em;font-weight:600;color:var(--lg-ink-2);
                margin-bottom:.89em;line-height:1.2}
.lg-input{
  width:100%;height:var(--lg-h-input);padding:0 calc(var(--lg-fs)*.9);
  background:var(--lg-field);
  border:1px solid var(--lg-line);border-radius:calc(var(--lg-fs)*.36);
  font-family:inherit;font-size:1em;color:var(--lg-ink-1);
  outline:none;transition:border-color .15s,box-shadow .15s;
  /* Báo cho trình duyệt biết đây là bề mặt tối: con trỏ nháy, vùng bôi đen,
     nút hiện/ẩn mật khẩu của Edge đều tự đổi sang bộ màu tối. Thiếu dòng này
     con trỏ nháy màu đen nằm trên nền đen — gõ mà không thấy trỏ ở đâu. */
  color-scheme:dark;
}
.lg-input::placeholder{color:rgba(255,255,255,.5)}
.lg-input:focus{border-color:var(--lg-ramp-hi);box-shadow:var(--lg-ring)}
/* Chrome tự sơn nền vàng nhạt + chữ đen khi điền lại mật khẩu đã lưu. Nó ghi đè
   cả background lẫn color nên đặt lại hai thuộc tính đó vô ích; chỉ còn cách
   phủ nền bằng box-shadow inset và ép chữ bằng -webkit-text-fill-color. Không
   có đoạn này thì ai lưu mật khẩu sẽ thấy hai ô sáng chói giữa thẻ tối. */
.lg-input:-webkit-autofill,
.lg-input:-webkit-autofill:hover,
.lg-input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--lg-ink-1);
  -webkit-box-shadow:0 0 0 1000px #55220A inset;
  caret-color:var(--lg-ink-1);
  transition:background-color 5000s ease-in-out 0s;
}

.lg-remember{
  display:flex;align-items:center;gap:calc(var(--lg-fs)*.6);margin-top:var(--lg-gap-remember);
  font-size:.83em;color:var(--lg-ink-3);cursor:pointer;user-select:none;
}
/* Ô tick vẽ TAY, không dùng ô mặc định. Trên nền tối, ô mặc định của Chrome là
   một khối xám đậm gần như tàng hình — accent-color chỉ đổi được lúc ĐÃ tick,
   còn lúc chưa tick (tức lúc người dùng cần nhìn thấy nó nhất) thì không đụng
   tới được. Nền trong suốt + viền trắng đúng như bản thiết kế. */
.lg-remember input{
  appearance:none;-webkit-appearance:none;
  width:calc(var(--lg-fs)*1.1);height:calc(var(--lg-fs)*1.1);flex:none;margin:0;
  border:1px solid var(--lg-line);border-radius:.25em;
  background:transparent;
  display:grid;place-content:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
/* Dấu tick là hình đa giác cắt từ khối màu — không phải ký tự ✓, vì ký tự lệ
   thuộc font hệ thống, máy thiếu font sẽ ra ô vuông tofu. */
.lg-remember input::before{
  content:"";width:calc(var(--lg-fs)*.68);height:calc(var(--lg-fs)*.68);transform:scale(0);transition:transform .12s;
  background:var(--lg-btn-ink);
  clip-path:polygon(14% 44%,0 65%,40% 100%,100% 16%,85% 0,38% 70%);
}
.lg-remember input:checked{background:var(--lg-btn);border-color:var(--lg-btn)}
.lg-remember input:checked::before{transform:scale(1)}
.lg-remember input:hover{border-color:rgba(255,255,255,.8)}
.lg-remember input:focus-visible{outline:none;box-shadow:var(--lg-ring)}

.lg-btn{
  width:100%;height:var(--lg-h-btn);margin-top:var(--lg-gap-btn);
  background:var(--lg-btn);
  /* Chữ NÂU ĐẬM trên nút hổ phách, không phải trắng: trắng trên #FBB03B chỉ
     đạt 2,0:1, đọc không nổi. #672A00 là màu bản thiết kế khai. */
  color:var(--lg-btn-ink);border:none;border-radius:999px;
  font-family:inherit;font-size:1.64em;font-weight:700;letter-spacing:.2px;
  cursor:pointer;transition:filter .15s;
}
.lg-btn:hover{filter:brightness(1.06)}
.lg-btn:active{filter:brightness(.94)}
.lg-btn:focus-visible{box-shadow:var(--lg-ring)}
.lg-btn:disabled{cursor:default;filter:grayscale(.4) brightness(.9)}

.lg-foot{margin-top:var(--lg-gap-foot);text-align:center;font-size:1.08em;
         color:var(--lg-ink-3)}

/* Hộp báo lỗi/thành công KHÔNG mượn token của app được. --danger-soft và
   --success-soft là nền phấn rất nhạt dành cho bề mặt SÁNG; đặt lên thẻ tối thì
   thành hai mảng trắng chói, mà --danger-fg (đỏ đậm) nằm trên đó lại không đọc
   nổi. Nên trang này tự pha: nền là chính màu đó hoà loãng vào nền tối, chữ là
   bản sáng của nó. */
.lg-msg{border-radius:.4em;padding:.65em .8em;font-size:.97em;margin-top:1.1em;
        line-height:1.45;border:1px solid transparent}
.lg-msg.err{background:rgba(190,60,40,.28);border-color:rgba(255,150,130,.4);color:#FFD3CA}
.lg-msg.ok{background:rgba(60,150,90,.28);border-color:rgba(140,225,170,.4);color:#CDF3DA}
.lg-field-err{color:var(--lg-err);font-size:.83em;margin-top:.4em}

/* ── MOBILE ────────────────────────────────────────────────────────────────
   Ảnh đổi sang bản DỌC 1080×2337 — bản thiết kế đặt nó cover, neo đáy, cắt
   phần dư ở trên (bbox trong PDF: ảnh cao 2588 trên khung 2502, hụt 86px ở
   đỉnh). Đúng bằng `cover` + `center bottom` dưới đây. */
@media (max-width:900px){
  /* `cover` dùng được vì ảnh đã là bản dọc 9:19,5 — gần đúng tỉ lệ điện thoại,
     chỗ bị xén chỉ là lề bo mạch hai bên, khối tròn nằm giữa nên không suy
     suyển. (Cảnh báo "đừng dùng cover" của bản cũ là dành cho ảnh VUÔNG.)
     Neo `bottom`: màn thấp hơn thì cắt ở TRÊN (toàn bo mạch), đừng cắt vào
     khối tròn ở đáy. */
  .lg-stage{
    align-items:flex-start;justify-content:center;
    background:var(--lg-page) url('/static/login_bg_mobile.webp?v=100ee82e') center bottom/cover no-repeat;
  }
  /* NEO LÊN TRÊN, không canh giữa dọc. Canh giữa thì thẻ tụt xuống đè kín khối
     tròn: đo ở 390×844 thẻ chạm đáy còn cách 108px, mà 108px đó là mép dưới
     ảnh — toàn bo mạch, nhìn ra vệt vàng nhoè chứ không ra hình. Neo trên vẫn
     an toàn khi thẻ cao hơn màn: trang cuộn bình thường, KHÔNG bị cắt mất phần
     đầu như align-items:center. */
  .lg-panel{width:100%;max-width:none;min-width:0;padding:34px 14px;
            margin-block:0;margin-right:0}

  /* Bản thiết kế để thẻ mobile chiếm 94,9% bề ngang, 63,3% chiều cao màn.
     Bề ngang thì theo được. Chiều cao thì KHÔNG theo nguyên si được: bố cục
     thiết kế rất thoáng, quy đúng tỉ lệ ra cỡ chữ nhãn 9,7px — nhỏ tới mức
     không dùng được. Nên mobile giữ nguyên bố cục nhưng BÓP khoảng cách dọc
     lại, đổi lại cỡ chữ đọc được. Kết quả cao ~510px, xấp xỉ 534px của bản
     thiết kế, mà chữ vẫn ≥12px. */
  .lg-card{
    max-width:460px;border-radius:20px;
    --lg-fs:12.5px;
    --lg-pad-top:calc(var(--lg-fs)*1.9);
    --lg-pad-bot:calc(var(--lg-fs)*1.5);
    --lg-pad-x:calc(var(--lg-fs)*1.6);
    --lg-gap-logo:calc(var(--lg-fs)*.95);
    --lg-gap-h2:calc(var(--lg-fs)*1.45);
    --lg-gap-group:calc(var(--lg-fs)*1.6);
    --lg-gap-group2:calc(var(--lg-fs)*1.3);
    --lg-gap-remember:calc(var(--lg-fs)*1.15);
    --lg-gap-btn:calc(var(--lg-fs)*1.3);
    --lg-gap-foot:calc(var(--lg-fs)*1.3);
    --lg-h-input:calc(var(--lg-fs)*3.5);
    --lg-h-btn:calc(var(--lg-fs)*3.7);
    box-shadow:0 10px 34px rgba(30,15,2,.3),0 3px 10px rgba(30,15,2,.2);
  }
  .lg-logo img{height:2.9em}
  /* 1,45em là cỡ lớn nhất mà CẢ 8 tên phòng còn giữ 1 dòng ở màn 390px —
     tên dài nhất là "HỆ THỐNG QUẢN LÝ KINH DOANH". Trên 1,45em thì 3 app rớt
     xuống 2 dòng, thẻ cao thêm 22px và ăn vào dải ảnh phía dưới. */
  .lg-title{font-size:1.45em}
  .lg-h2{font-size:1.45em}
  /* Ô nhập PHẢI ≥16px: dưới mức đó iOS Safari tự phóng to cả trang khi chạm
     vào ô, người dùng phải chụm tay thu lại. 1.28em × 12,5px = 16px. */
  .lg-input{font-size:1.28em;padding:0 .8em}
  .lg-btn{font-size:1.35em}
  .lg-foot{font-size:.95em}
}
@media (max-width:380px){
  /* Dưới 380px thì KHÔNG cỡ nào giữ nổi 1 dòng cho tên dài (đã dò tới 0,8em
     vẫn xuống dòng) — nên để nó xuống 2 dòng, chỉ hạ cỡ cho đỡ chật. Thẻ cao
     thêm ~20px, khối tròn vàng vẫn còn chỗ. */
  .lg-card{--lg-fs:11.8px;--lg-pad-x:calc(var(--lg-fs)*1.4)}
  .lg-title{font-size:1.3em}
}
/* Màn thấp (điện thoại xoay ngang): ảnh neo đáy sẽ bị thẻ đè kín hoàn toàn,
   giữ lại chỉ tốn băng thông — bỏ hẳn, nhường chỗ cho form. */
@media (max-height:520px) and (max-width:900px){
  .lg-stage{background-image:none;align-items:center}
  .lg-panel{padding:14px 12px;margin-block:auto}
}
</style>
</head>
<body>

<div class="lg-stage">
  <div class="lg-panel">
    <main class="lg-card">

      <div class="lg-logo">
        <!-- Logo tự host trong static/ — bản URL papasanvietnam.vn cũ làm trang
             đổi giao diện tuỳ mạng: tải được thì có logo, rớt mạng thì thành
             chữ trơn. onerror giữ lại chữ để trang không bao giờ trống đầu. -->
        <img src="/static/papasan_logo_wordmark.png?v=2e7e6c18" alt="Papasan Việt Nam"
             onerror="this.outerHTML='<span style=&quot;font-weight:900;letter-spacing:2px;color:var(--lg-ink-3)&quot;>PAPASAN</span>'">
      </div>

      <h1 class="lg-title">HỆ THỐNG QUẢN LÝ KẾ TOÁN</h1>

      <h2 class="lg-h2">Đăng nhập</h2>
      <div class="lg-hint">Dùng tài khoản nội bộ Papasan của bạn</div>

      <!-- Nhánh ✅: KHÔNG nơi nào trong repo này tạo chuỗi bắt đầu bằng ✅ — nó
           dành cho flow của auth_service ngoài repo (đổi/reset mật khẩu redirect
           về /login). Đừng xoá khi chưa kiểm tra monorepo App_V2. -->
      {% if error %}
        {% if error.startswith('✅') %}
          <div class="lg-msg ok" role="status">{{ error }}</div>
        {% else %}
          <div class="lg-msg err" role="alert">{{ error }}</div>
        {% endif %}
      {% endif %}

      <form method="POST" action="/login" id="login-form" novalidate>
        <input type="hidden" name="action" value="login">

        <div class="lg-group">
          <label for="login-username">Tên đăng nhập</label>
          <input class="lg-input" type="text" name="username" id="login-username"
                 autocomplete="username" autofocus required minlength="3">
        </div>

        <div class="lg-group">
          <label for="login-password">Mật khẩu</label>
          <input class="lg-input" type="password" name="password" id="login-password"
                 autocomplete="current-password" required minlength="3">
        </div>

        <label class="lg-remember" for="cb-remember">
          <input type="checkbox" name="remember" value="1" id="cb-remember">
          Ghi nhớ đăng nhập (30 ngày)
        </label>

        <button class="lg-btn" type="submit" id="login-submit">Đăng nhập</button>
      </form>

      <div class="lg-foot">Papasan &copy; 2026 &mdash; Phòng Kế Toán</div>

    </main>
  </div>
</div>

<script>
/* Kiểm tra phía trình duyệt. Lý do phải có: form khai minlength="3" nhưng cũng
   khai novalidate, nên nếu không có đoạn này thì gõ tên 2 ký tự rồi bấm sẽ
   KHÔNG có gì xảy ra và cũng KHÔNG báo gì — lỗi "nút chết" từng làm người dùng
   tưởng hỏng server. */
(function(){
  var form = document.getElementById('login-form');
  if (!form) return;
  var btn = document.getElementById('login-submit');
  var u = document.getElementById('login-username');
  var p = document.getElementById('login-password');

  function showErr(inp, msg){
    inp.style.borderColor = 'var(--lg-err)';
    inp.setAttribute('aria-invalid','true');
    var hint = inp.parentElement.querySelector('.lg-field-err');
    if (!hint){
      hint = document.createElement('div');
      hint.className = 'lg-field-err';
      /* id + aria-describedby + role=alert: nối lỗi vào input để máy đọc màn
         hình đọc được — aria-invalid một mình chỉ báo "sai", không báo "vì sao" */
      hint.id = inp.id + '-err';
      hint.setAttribute('role','alert');
      inp.parentElement.appendChild(hint);
    }
    inp.setAttribute('aria-describedby', hint.id);
    hint.textContent = msg;
  }
  function clearErr(inp){
    inp.style.borderColor = '';
    inp.removeAttribute('aria-invalid');
    inp.removeAttribute('aria-describedby');
    var hint = inp.parentElement.querySelector('.lg-field-err');
    if (hint) hint.remove();
  }

  [u,p].forEach(function(inp){
    inp.addEventListener('input', function(){ clearErr(inp); });
  });

  form.addEventListener('submit', function(e){
    var ok = true;
    if (!u.value.trim() || u.value.trim().length < 3){ showErr(u,'Tên đăng nhập tối thiểu 3 ký tự'); ok = false; }
    if (!p.value || p.value.length < 3){ showErr(p,'Mật khẩu tối thiểu 3 ký tự'); ok = false; }
    if (!ok){ e.preventDefault(); return; }
    if (btn){ btn.disabled = true; btn.textContent = 'Đang đăng nhập...'; }
  });
})();
</script>
</body>
</html>
