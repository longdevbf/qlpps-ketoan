<!-- Ảnh nền là thứ nặng nhất trang. preload để nó tải song song với CSS thay vì
     đợi CSS parse xong mới biết cần tải.
     `media` là bắt buộc, không phải tô điểm: không có nó thì điện thoại tải cả
     bản desktop 130 KB nó KHÔNG BAO GIỜ dùng, cộng thêm 78 KB bản mobile —
     tốn gần gấp ba trên đúng loại kết nối yếu nhất. Ngưỡng 900px phải khớp
     media query ở cuối <style>. -->
<link rel="preload" as="image" href="/static/login_bg.webp?v=baa970d3" media="(min-width:901px)">
<link rel="preload" as="image" href="/static/login_bg_mobile.webp?v=100ee82e" media="(max-width:900px)">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── MÀU RIÊNG CỦA TRANG ───────────────────────────────────────────────────
   Trang đăng nhập cố ý ĐỨNG NGOÀI hệ token hổ phách của app: nền ảnh là xám
   trung tính, nên dùng --brand/--bg-page (ám vàng) sẽ lệch tông thấy rõ ngay
   cạnh ảnh. Các giá trị dưới đây CHỈ sống trong file này, không rò ra phần
   còn lại của app — muốn đổi giao diện login thì đổi đúng ở đây.
   --lg-page lấy đúng màu mép ảnh (đo bằng Pillow: #F7F7F7) để chỗ ảnh hết và
   nền trang bắt đầu không nhìn ra đường ghép. */
:root{
  --lg-page:  #F7F7F7;
  --lg-card:  #EFEFEF;
  --lg-field: #FFFFFF;
  --lg-line:  #DCDCDC;
  --lg-ink-1: #1F2124;
  --lg-ink-2: #4A4D51;
  --lg-ink-3: #8A8D91;
  /* Tiêu đề hệ thống để XÁM cùng tông với wordmark Papasan ngay phía trên
     (wordmark bị grayscale(1) opacity(.55) nên hiện ra ~#B7B7B7). Không lấy
     đúng #B7B7B7: trên nền thẻ #EFEFEF nó chỉ còn 1.8:1, đọc không nổi.
     #82868A là điểm xám đậm nhất vẫn "cùng tông logo" mà đạt 3.19:1 — ngưỡng
     3:1 cho chữ lớn in đậm. Đừng làm nhạt thêm. */
  --lg-ink-title: #82868A;
  --lg-ring:  0 0 0 3px rgba(233,155,44,.30);
  /* Nút: đen -> CAM. Điểm dừng 40%/74% giữ nửa trái gần như đen đúng như bản
     thiết kế; chuyển hết sang cam sẽ thành nút cam đặc, không còn giống.
     Đuôi là cam #EE7B1D chứ KHÔNG phải hổ phách #F0A22F — bản cũ ngả vàng. */
  --lg-btn:   linear-gradient(90deg,#141414 0%,#2A1A10 40%,#A55712 74%,#EE7B1D 100%);
}

html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  background:var(--lg-page);
  color:var(--lg-ink-1);
  -webkit-font-smoothing:antialiased;
}

/* DESKTOP: ảnh phủ TOÀN màn, thẻ nổi lên trên và lệch phải.
   background-position 32% chứ KHÔNG phải center: `cover` cắt bớt cạnh dài, để
   center thì khối tròn vàng (nằm ở ~30% chiều ngang ảnh) bị cắt mất mép trái
   trên màn hẹp/cao. 32% giữ khối tròn lọt trọn ở mọi tỉ lệ thường gặp, đồng
   thời đẩy nó về nửa trái để không bị thẻ đè lên. */
.lg-stage{
  display:flex;align-items:center;justify-content:flex-end;
  min-height:100vh;min-height:100dvh;
  background:var(--lg-page) url('/static/login_bg.webp?v=baa970d3') 32% center/cover no-repeat;
}

.lg-panel{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  padding:24px 0;
  /* Lề phải LÀ thứ quyết định thẻ nằm đâu (.lg-stage căn flex-end).
     Công thức cho tâm thẻ đứng đúng 66% bề ngang ở MỌI màn:
         lề = 34% − (nửa bề ngang thẻ) = 34% − 300px
     ⇒ mép phải thẻ = W − (0,34W − 300) ⇒ tâm = 0,66W. Bản cũ để 10vw nên tâm
     trôi theo màn: 75% ở 1920 mà 72% ở 2560 — càng rộng càng dạt sang phải.
     300px LÀ NỬA CỦA width:600px ở .lg-card — đổi bề ngang thẻ thì phải đổi số
     này, không thì tâm lệch. max(24px, …) chặn lề âm khi màn hẹp hơn ~880px. */
  margin-right:max(24px, calc(34% - 300px));
}

.lg-card{
  /* 600px chứ không phải 430px gốc: bản thiết kế muốn thẻ chiếm mảng lớn hơn
     hẳn trên nền ảnh. Mọi kích thước bên trong (đệm, cỡ chữ, chiều cao ô nhập)
     đã nhân theo cùng tỉ lệ — đổi mỗi width sẽ ra thẻ rộng mà ruột nhỏ.
     Đây là cỡ DESKTOP; mobile chốt trần riêng nhỏ hơn nhiều, xem media query. */
  width:600px;max-width:80%;
  height: 700px;
  background:var(--lg-card);
  border-radius:16px;
  /* Bóng đậm hơn bản cũ: thẻ xám nhạt đứng trên nền ảnh cũng sáng, không có
     bóng đủ sâu thì hai mảng dính vào nhau, không thấy mép thẻ */
  box-shadow:0 12px 44px rgba(0,0,0,.16);
  padding:40px 46px 32px;
}

.lg-logo{display:flex;justify-content:center;margin-bottom:18px}
/* Wordmark gốc là cam-nâu. Bản thiết kế để nó xám nhạt cho khỏi tranh màu với
   nút và với ảnh — bỏ dòng filter này là logo về màu thật. */
.lg-logo img{max-width:250px;width:100%;height:auto;object-fit:contain;filter:grayscale(1) opacity(.55)}

.lg-title{
  font-size:26px;font-weight:800;letter-spacing:.2px;line-height:1.25;
  text-align:center;color:var(--lg-ink-title);
  padding-bottom:18px;border-bottom:1px solid var(--lg-line);
}

.lg-h2{font-size:22px;font-weight:800;color:var(--lg-ink-1);margin-top:26px}
.lg-hint{font-size:14px;color:var(--lg-ink-3);margin-top:4px}

.lg-group{margin-top:22px}
/* Khoảng thở giữa cụm tiêu đề và ô nhập đầu tiên — bản thiết kế để rộng hơn
   khoảng cách giữa hai ô nhập, để mắt tách được "phần giới thiệu" với "phần điền" */
form .lg-group:first-of-type{margin-top:30px}
.lg-group label{display:block;font-size:13.5px;font-weight:700;color:var(--lg-ink-2);margin-bottom:8px}
.lg-input{
  width:100%;padding:14px 14px;
  background:var(--lg-field);
  border:1px solid var(--lg-line);border-radius:7px;
  font-family:inherit;font-size:16px;color:var(--lg-ink-1);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.lg-input:focus{border-color:#C9A96A;box-shadow:var(--lg-ring)}

.lg-remember{
  display:flex;align-items:center;gap:9px;margin-top:18px;
  font-size:13.5px;color:var(--lg-ink-3);cursor:pointer;user-select:none;
}
.lg-remember input{width:17px;height:17px;flex:none;accent-color:#B8791C;cursor:pointer}

.lg-btn{
  width:100%;margin-top:22px;padding:17px;
  background:var(--lg-btn);
  color:#FFFFFF;border:none;border-radius:999px;
  font-family:inherit;font-size:18px;font-weight:700;letter-spacing:.2px;
  cursor:pointer;transition:filter .15s;
}
.lg-btn:hover{filter:brightness(1.08)}
.lg-btn:active{filter:brightness(.94)}
.lg-btn:focus-visible{box-shadow:var(--lg-ring)}
.lg-btn:disabled{cursor:default;filter:grayscale(.4) brightness(.9)}

.lg-foot{margin-top:22px;text-align:center;font-size:13px;color:var(--lg-ink-3)}

/* Hộp báo lỗi/thành công dùng token trạng thái của chính app — đây là chỗ duy
   nhất trang này mượn màu hệ thống, vì lỗi phải trông giống lỗi ở mọi màn khác */
.lg-msg{border-radius:8px;padding:11px 14px;font-size:14.5px;margin-top:18px;line-height:1.45}
.lg-msg.err{background:var(--danger-soft);color:var(--danger-fg)}
.lg-msg.ok{background:var(--success-soft);color:var(--success-fg)}
.lg-field-err{color:var(--danger,#B02A18);font-size:13px;margin-top:6px}

/* ── MOBILE ────────────────────────────────────────────────────────────────
   Đổi sang bản ảnh DỌC 1080×1920 — ảnh ngang của desktop đặt trên khung dọc
   thì `cover` xén mất khối tròn. Bản dọc đã dựng sẵn đúng bố cục cần: kết cấu
   bo mạch ở nửa trên (chỗ thẻ nổi lên), khối tròn vàng ở đáy. */
@media (max-width:900px){
  /* `cover` DÙNG ĐƯỢC ở đây vì ảnh đã là bản dọc 9:16, gần đúng tỉ lệ điện
     thoại — chỗ bị xén chỉ là lề bo mạch hai bên, khối tròn nằm giữa nên
     không suy suyển. (Cảnh báo "đừng dùng cover" của bản cũ là dành cho ảnh
     VUÔNG: vuông trên khung dọc thì cover phóng theo chiều cao rồi cắt hai
     bên, mất gần nửa khối tròn.)
     Neo `bottom` chứ không `center`: màn thấp hơn 9:16 thì phần dư bị cắt,
     cắt ở trên (toàn bo mạch) chứ đừng cắt vào khối tròn ở đáy. */
  .lg-stage{
    align-items:flex-start;justify-content:center;
    background:var(--lg-page) url('/static/login_bg_mobile.webp?v=100ee82e') center bottom/cover no-repeat;
  }
  /* margin-block:auto chứ KHÔNG phải align-items:center — hai cái cùng canh
     giữa dọc, nhưng khi thẻ cao hơn màn (điện thoại nhỏ, bàn phím bật lên,
     thêm dòng báo lỗi) thì align-items:center cắt mất phần đầu thẻ và KHÔNG
     cuộn tới được. margin auto hết chỗ trống thì tự về 0, thẻ tụt lên đầu và
     trang cuộn bình thường. */
  /* NEO LÊN TRÊN, không margin-block:auto nữa. Canh giữa dọc thì thẻ tụt xuống
     đè kín ảnh: đo ở 390×844 thẻ chạm đáy còn cách 108px, mà 108px đó là MÉP
     DƯỚI ảnh — phần bo mạch, không có khối tròn vàng, nên nhìn ra một vệt vàng
     nhoè chứ không ra hình. Neo lên trên thì dải ảnh dưới thẻ luôn đủ để thấy
     khối tròn. Thẻ cao hơn màn thì trang cuộn bình thường — vẫn không bị cắt
     đầu như align-items:center. */
  .lg-panel{width:100%;padding:150px 14px;margin-block:0;margin-right:0}
  /* Cỡ MOBILE gọn hẳn so với desktop 600px. Không phải để "cho vừa bề ngang" —
     460px thì màn nào cũng vừa — mà để thẻ ĐỦ THẤP, chừa dải ảnh ở đáy. Mỗi
     50px chiều cao thẻ ăn thẳng 50px của ảnh. Phóng to lại là ảnh mất. */
  .lg-card{width:100%;max-width:460px;border-radius:20px;padding:24px 20px 18px;
           box-shadow:0 10px 34px rgba(0,0,0,.13)}
  .lg-logo{margin-bottom:12px}
  .lg-logo img{max-width:190px}
  .lg-title{font-size:19px;padding-bottom:13px}
  .lg-h2{font-size:18px;margin-top:18px}
  .lg-hint{font-size:12.5px}
  .lg-group{margin-top:16px}
  form .lg-group:first-of-type{margin-top:20px}
  .lg-group label{font-size:12.5px;margin-bottom:6px}
  /* Chỉ hạ đệm, GIỮ font-size:16px của desktop: dưới 16px thì iOS Safari tự
     phóng to cả trang khi chạm vào ô nhập, người dùng phải chụm tay thu lại. */
  .lg-input{padding:12px}
  .lg-remember{margin-top:14px;font-size:12.5px}
  .lg-btn{margin-top:16px;padding:14px;font-size:16px}
  .lg-foot{margin-top:16px;font-size:12px}
  .lg-msg{font-size:13.5px;margin-top:14px;padding:9px 12px}
}
@media (max-width:380px){
  .lg-card{padding:22px 16px 16px}
  .lg-title{font-size:17.5px}
}
/* Màn thấp (điện thoại xoay ngang): bỏ ảnh đi, nhường chỗ cho form */
/* Màn thấp (điện thoại xoay ngang): ảnh neo đáy sẽ bị thẻ đè kín hoàn toàn,
   giữ lại chỉ tốn băng thông — bỏ hẳn, nhường chỗ cho form. */
@media (max-height:520px) and (max-width:900px){
  .lg-stage{background-image:none;align-items:center}
  .lg-panel{padding:14px 12px;margin-block:auto}
}
</style>
</head>
<body>

<div class="lg-stage">
  <div class="lg-panel">
    <main class="lg-card">

      <div class="lg-logo">
        <!-- Logo tự host trong static/ — bản URL papasanvietnam.vn cũ làm trang
             đổi giao diện tuỳ mạng: tải được thì có logo, rớt mạng thì thành
             chữ trơn. onerror giữ lại chữ để trang không bao giờ trống đầu. -->
        <img src="/static/papasan_logo_wordmark.png?v=2e7e6c18" alt="Papasan Việt Nam"
             onerror="this.outerHTML='<span style=&quot;font-weight:900;letter-spacing:2px;color:var(--lg-ink-3)&quot;>PAPASAN</span>'">
      </div>

      <h1 class="lg-title">HỆ THỐNG QUẢN LÝ KẾ TOÁN</h1>

      <h2 class="lg-h2">Đăng nhập</h2>
      <div class="lg-hint">Dùng tài khoản nội bộ Papasan của bạn</div>

      <!-- Nhánh ✅: KHÔNG nơi nào trong repo này tạo chuỗi bắt đầu bằng ✅ — nó
           dành cho flow của auth_service ngoài repo (đổi/reset mật khẩu redirect
           về /login). Đừng xoá khi chưa kiểm tra monorepo App_V2. -->
      {% if error %}
        {% if error.startswith('✅') %}
          <div class="lg-msg ok" role="status">{{ error }}</div>
        {% else %}
          <div class="lg-msg err" role="alert">{{ error }}</div>
        {% endif %}
      {% endif %}

      <form method="POST" action="/login" id="login-form" novalidate>
        <input type="hidden" name="action" value="login">

        <div class="lg-group">
          <label for="login-username">Tên đăng nhập</label>
          <input class="lg-input" type="text" name="username" id="login-username"
                 autocomplete="username" autofocus required minlength="3">
        </div>

        <div class="lg-group">
          <label for="login-password">Mật khẩu</label>
          <input class="lg-input" type="password" name="password" id="login-password"
                 autocomplete="current-password" required minlength="3">
        </div>

        <label class="lg-remember" for="cb-remember">
          <input type="checkbox" name="remember" value="1" id="cb-remember">
          Ghi nhớ đăng nhập (30 ngày)
        </label>

        <button class="lg-btn" type="submit" id="login-submit">Đăng nhập</button>
      </form>

      <div class="lg-foot">Papasan &copy; 2026 &mdash; Phòng Kế Toán</div>

    </main>
  </div>
</div>

<script>
/* Kiểm tra phía trình duyệt. Lý do phải có: form khai minlength="3" nhưng cũng
   khai novalidate, nên nếu không có đoạn này thì gõ tên 2 ký tự rồi bấm sẽ
   KHÔNG có gì xảy ra và cũng KHÔNG báo gì — lỗi "nút chết" từng làm người dùng
   tưởng hỏng server. */
(function(){
  var form = document.getElementById('login-form');
  if (!form) return;
  var btn = document.getElementById('login-submit');
  var u = document.getElementById('login-username');
  var p = document.getElementById('login-password');

  function showErr(inp, msg){
    inp.style.borderColor = 'var(--danger,#B02A18)';
    inp.setAttribute('aria-invalid','true');
    var hint = inp.parentElement.querySelector('.lg-field-err');
    if (!hint){
      hint = document.createElement('div');
      hint.className = 'lg-field-err';
      /* id + aria-describedby + role=alert: nối lỗi vào input để máy đọc màn
         hình đọc được — aria-invalid một mình chỉ báo "sai", không báo "vì sao" */
      hint.id = inp.id + '-err';
      hint.setAttribute('role','alert');
      inp.parentElement.appendChild(hint);
    }
    inp.setAttribute('aria-describedby', hint.id);
    hint.textContent = msg;
  }
  function clearErr(inp){
    inp.style.borderColor = '';
    inp.removeAttribute('aria-invalid');
    inp.removeAttribute('aria-describedby');
    var hint = inp.parentElement.querySelector('.lg-field-err');
    if (hint) hint.remove();
  }

  [u,p].forEach(function(inp){
    inp.addEventListener('input', function(){ clearErr(inp); });
  });

  form.addEventListener('submit', function(e){
    var ok = true;
    if (!u.value.trim() || u.value.trim().length < 3){ showErr(u,'Tên đăng nhập tối thiểu 3 ký tự'); ok = false; }
    if (!p.value || p.value.length < 3){ showErr(p,'Mật khẩu tối thiểu 3 ký tự'); ok = false; }
    if (!ok){ e.preventDefault(); return; }
    if (btn){ btn.disabled = true; btn.textContent = 'Đang đăng nhập...'; }
  });
})();
</script>
</body>
</html>
