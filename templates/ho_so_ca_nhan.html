<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Hồ sơ cá nhân — HCNS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231a3c5e'/><text x='50%25' y='56%25' font-size='38' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-weight='bold' fill='white'>H</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh;color:#1f2937;overflow-x:hidden}
.topbar{background:#1a3c5e;color:#fff;padding:0 24px;height:52px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.topbar .logo{font-size:15px;font-weight:800;letter-spacing:.5px}
.topbar .title{font-size:14px;font-weight:700;color:#7ec8e3}
.topbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
.t-btn{padding:5px 14px;border-radius:7px;border:0;cursor:pointer;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff}
.t-btn:hover{background:rgba(255,255,255,.22)}
.page{max-width:1100px;margin:0 auto;padding:18px 16px}

.tabs{display:flex;gap:6px;margin-bottom:14px;background:#fff;border-radius:10px;padding:6px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tab-btn{flex:0 0 auto;padding:9px 18px;border:0;background:transparent;font-size:13px;font-weight:700;color:#64748b;cursor:pointer;border-radius:7px;transition:all .15s}
.tab-btn:hover{background:#f0f6ff;color:#1a3c5e}
.tab-btn.active{background:#1a3c5e;color:#fff}

.banner{padding:12px 16px;border-radius:9px;margin-bottom:14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px}
.banner-info{background:#dbeafe;color:#1e40af;border-left:4px solid #3b82f6}
.banner-warn{background:#fef3c7;color:#92400e;border-left:4px solid #f59e0b}
.banner-success{background:#d1fae5;color:#065f46;border-left:4px solid #10b981}
.banner-locked{background:#f1f5f9;color:#475569;border-left:4px solid #94a3b8}

.card{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 1px 5px rgba(0,0,0,.06);margin-bottom:14px}
.card-h{font-size:13px;font-weight:800;color:#1a3c5e;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #eef2f7;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}

.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 22px}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}}
@media(max-width:768px){.field input,.field select,.field textarea{font-size:16px}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.3px}
.field label .req{color:#dc2626;margin-left:2px}
.field input,.field select,.field textarea{padding:8px 11px;border:1.5px solid #cbd5e1;border-radius:7px;font-size:13px;color:#1a3c5e;background:#fff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#1a6e4b;box-shadow:0 0 0 3px rgba(26,110,75,.12)}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:#f8fafc;color:#64748b;cursor:not-allowed}
.field textarea{min-height:60px;resize:vertical}

.btn{padding:8px 18px;border-radius:7px;border:0;cursor:pointer;font-size:13px;font-weight:700;transition:all .15s}
.btn-primary{background:#1a6e4b;color:#fff}
.btn-primary:hover{background:#14573b}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-secondary{background:#e8f0fe;color:#1a3c5e;border:1.5px solid #c5d4ec}
.btn-danger{background:#fee2e2;color:#991b1b;border:1.5px solid #fca5a5}
.btn-warning{background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d}
.btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.doc-card{background:#fafbfc;border:1.5px solid #e2e8f0;border-radius:9px;padding:12px;position:relative}
.doc-card.has-file{background:#f0fdf4;border-color:#86efac}
.doc-card .doc-type{font-size:12px;font-weight:700;color:#1a3c5e;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.doc-card .doc-type .badge-req{background:#dc2626;color:#fff;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:700}
.doc-card .doc-file-info{font-size:11px;color:#64748b;margin:6px 0;line-height:1.5}
.doc-card .doc-actions{display:flex;gap:6px;margin-top:8px}
.doc-card .status-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px}
.status-cho_duyet{background:#fef3c7;color:#92400e}
.status-da_duyet{background:#d1fae5;color:#065f46}
.status-tu_choi{background:#fee2e2;color:#991b1b}

.upload-area{background:#f0f6ff;border:2px dashed #93c5fd;border-radius:9px;padding:14px;text-align:center;cursor:pointer;transition:all .15s}
.upload-area:hover{background:#dbeafe;border-color:#3b82f6}
.upload-area input[type=file]{display:none}

.emp-table{width:100%;border-collapse:collapse;font-size:13px}
.emp-table th,.emp-table td{padding:9px 11px;border-bottom:1px solid #eef2f7;text-align:left}
.emp-table th{background:#f8fafc;color:#475569;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.emp-table tbody tr:hover{background:#f8fafc;cursor:pointer}
.emp-table .ma-nv{font-family:'Courier New',monospace;font-weight:700;color:#1a3c5e}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:24px 12px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;max-width:900px;width:100%;padding:0;max-height:90vh;overflow-y:auto}
.modal-h{padding:16px 22px;border-bottom:1px solid #eef2f7;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-h h2{font-size:16px;color:#1a3c5e}
.modal-body{padding:18px 22px}
.modal-close{background:#fee2e2;color:#991b1b;border:0;border-radius:6px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:13px}

.toast{position:fixed;bottom:24px;right:24px;background:#1a3c5e;color:#fff;padding:11px 18px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:300;font-weight:600;font-size:13px;display:none}
.toast.error{background:#991b1b}
.toast.show{display:block;animation:slideIn .2s ease-out}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:#1a3c5e;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 16px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">HCNS</div>
  <span style="color:rgba(255,255,255,.3)">|</span>
  <div class="title">👤 Hồ sơ cá nhân</div>
  <div class="right">
    <button class="t-btn" onclick="window.history.back()">← Quay lại</button>
  </div>
</div>

<div class="page">

  <!-- ─── 2 TAB: Chấm công Lương / Thông tin cá nhân ─── -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-cc" onclick="switchProfileTab('cc')">💰 Chấm Công &amp; Lương</button>
    <button class="tab-btn" id="tab-btn-me" onclick="switchProfileTab('me')">👤 Thông tin cá nhân</button>
  </div>

  <!-- ───────── TAB 1: Chấm Công + Lương (default active) ───────── -->
  <div id="tab-pane-cc">
    <!-- Toolbar -->
    <div class="card" style="padding:12px 16px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <label style="font-size:12px;font-weight:700;color:#475569">Tháng:</label>
        <input type="month" id="me-cc-month" style="padding:6px 10px;border:1.5px solid #cbd5e1;border-radius:7px;font-size:13px" onchange="loadMyPayroll()">
        <button class="btn btn-secondary" onclick="loadMyPayroll()">🔄 Tải lại</button>
        <div id="me-cc-info" style="margin-left:auto;font-size:12px;color:#64748b"></div>
      </div>
    </div>

    <!-- Tổng quan lương — 4 stat cards -->
    <div id="me-summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px"></div>

    <!-- Chi tiết bảng lương -->
    <div class="card">
      <div class="card-h">💵 Bảng Lương Tháng — Chi Tiết</div>
      <div id="me-payroll-detail">
        <div class="empty"><div class="spinner"></div> Đang tải...</div>
      </div>
    </div>

    <!-- Lịch chấm công -->
    <div class="card">
      <div class="card-h">📅 Lịch Chấm Công Trong Tháng</div>
      <div id="me-cham-cong-calendar"><div class="empty"><div class="spinner"></div> Đang tải...</div></div>
    </div>
  </div>

  <!-- ───────── TAB 2: Hồ sơ của tôi (cũ) ───────── -->
  <div id="tab-pane-me" style="display:none">
    <div id="me-banner"></div>
    <div id="me-content">
      <div class="card"><div class="empty"><div class="spinner"></div> Đang tải hồ sơ...</div></div>
    </div>

    <!-- ───────── Đổi mật khẩu ─────────────────────────────────────── -->
    <div class="card">
      <div class="card-h">🔑 Đổi mật khẩu</div>
      <div class="form-grid">
        <div class="field"><label>Mật khẩu hiện tại <span class="req">*</span></label>
          <input id="pw-cur" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại"></div>
        <div class="field"><label>Mật khẩu mới <span class="req">*</span></label>
          <input id="pw-new" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự"></div>
        <div class="field"><label>Xác nhận mật khẩu mới <span class="req">*</span></label>
          <input id="pw-cfm" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới"></div>
      </div>
      <div id="pw-msg" style="display:none;margin-top:10px;padding:8px 11px;border-radius:6px;font-size:12px;font-weight:600"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="pw-submit" onclick="submitChangePwd()">🔑 Đổi mật khẩu</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const fmtSize = b => !b ? '' : b < 1024 ? b + 'B' : b < 1048576 ? (b/1024).toFixed(1) + 'KB' : (b/1048576).toFixed(1) + 'MB';
const fmtDate = s => s ? new Date(s).toLocaleString('vi-VN') : '—';
const fmtShortDate = s => s ? new Date(s).toLocaleDateString('vi-VN') : '—';
let _currentUser = null;
let _meProfile = null;
let _loaiOptions = [];

function toast(msg, isErr = false) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2400);
}
async function api(method, url, body, isForm) {
  const opts = { method, credentials: 'include', headers: {} };
  if (body) {
    if (isForm) { opts.body = body; }
    else { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  }
  const r = await fetch(url, opts);
  if (r.status === 401) { window.location.href = '/login'; return null; }
  if (r.status === 204) return null;
  const ct = r.headers.get('Content-Type') || '';
  const d = ct.includes('application/json') ? await r.json() : await r.text();
  if (!r.ok) { const err = (d && d.detail) || d || 'Lỗi'; throw new Error(typeof err === 'string' ? err : JSON.stringify(err)); }
  return d;
}

// ── Init ────────────────────────────────────────────────────────────────────
// Anh Quang 2026-06-06: Tab 1 (Chấm công Lương) phải chạy ngay cả khi
// /api/profile-workflow/meta/loai-giay-to (chỉ có HCNS) trả 404 ở baogia/...
(async () => {
  // Set default month input = current month
  const now = new Date();
  const mInput = $('me-cc-month');
  if(mInput) mInput.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // Tab 1 — quan trọng nhất, gọi NGAY và độc lập
  loadMyPayroll().catch(e => console.warn('loadMyPayroll:', e));

  // Phụ trợ: profile + meta cho Tab 2, fail-soft không block Tab 1
  try { _currentUser = await api('GET', '/api/profile'); }
  catch (e) { console.warn('profile:', e); }
  try {
    const meta = await api('GET', '/api/profile-workflow/meta/loai-giay-to');
    _loaiOptions = meta.options || [];
  } catch (e) { console.warn('meta loai-giay-to (chỉ HCNS):', e); }
  loadMyProfile().catch(e => console.warn('loadMyProfile:', e));
})();

function switchProfileTab(name){
  ['cc','me'].forEach(n => {
    const pane = $('tab-pane-'+n), btn = $('tab-btn-'+n);
    if(pane) pane.style.display = (n===name ? '' : 'none');
    if(btn)  btn.classList.toggle('active', n===name);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// TAB 1 — Chấm Công + Lương cá nhân (data từ /api/payroll/me)
// ═══════════════════════════════════════════════════════════════════════════
const fmtVnd = n => Number(n||0).toLocaleString('vi-VN');

async function loadMyPayroll(){
  const thang = $('me-cc-month').value;
  if(!thang) return;
  $('me-summary').innerHTML = '';
  $('me-payroll-detail').innerHTML = '<div class="empty"><div class="spinner"></div> Đang tải...</div>';
  $('me-cham-cong-calendar').innerHTML = '<div class="empty"><div class="spinner"></div> Đang tải...</div>';
  try {
    const d = await api('GET', `/api/payroll/me?thang=${thang}`);
    const e = d.employee || {};
    const p = d.payroll;
    const [y,m] = thang.split('-');
    $('me-cc-info').textContent = `${e.ma_nv} • ${e.ho_ten} • ${e.phong_ban||'—'}`;
    if(!p){
      $('me-summary').innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty">Tháng ${m}/${y}: chưa có dữ liệu lương (NV chưa active hoặc nghỉ trước tháng này).</div></div>`;
      $('me-payroll-detail').innerHTML = '';
      renderMyChamCong(d.cham_cong || [], y, m);
      return;
    }
    // 4 stat cards
    $('me-summary').innerHTML = `
      <div class="card" style="padding:14px;border-left:5px solid #3b82f6">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700">Lương cơ bản</div>
        <div style="font-size:20px;font-weight:800;color:#1e40af;margin-top:4px">${fmtVnd(p.luong_co_ban)}đ</div>
      </div>
      <div class="card" style="padding:14px;border-left:5px solid #10b981">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700">Số ngày công</div>
        <div style="font-size:20px;font-weight:800;color:#15803d;margin-top:4px">${Number(p.so_ngay_cong||0).toFixed(2)} ngày</div>
      </div>
      <div class="card" style="padding:14px;border-left:5px solid #f59e0b">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700">Tổng cộng</div>
        <div style="font-size:20px;font-weight:800;color:#b45309;margin-top:4px">${fmtVnd(p.tong_cong)}đ</div>
      </div>
      <div class="card" style="padding:14px;border-left:5px solid #15803d;background:#f0fdf4">
        <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700">💰 Thực Nhận</div>
        <div style="font-size:22px;font-weight:900;color:#15803d;margin-top:4px">${fmtVnd(p.luong_thuc_nhan)}đ</div>
      </div>
    `;
    // Detail breakdown
    const rowKv = (lbl, val, color) => `<tr><td style="padding:8px 12px;color:#475569">${lbl}</td><td style="padding:8px 12px;text-align:right;font-weight:700;color:${color||'#1e293b'};font-variant-numeric:tabular-nums">${fmtVnd(val)}đ</td></tr>`;
    const cong = [
      ['+ Lương theo công', p.luong_theo_cong, '#1e40af'],
      ['+ Ăn trưa', p.an_trua, '#15803d'],
      ['+ Trách nhiệm', p.trach_nhiem, '#92400e'],
      ['+ Công tác xưởng', p.cong_tac_xuong, '#1e40af'],
      ['+ Hoa hồng', p.hoa_hong, '#6b21a8'],
      ['+ OT ca gãy', p.ot_ca_gay, '#15803d'],
      ['+ Trực tối', p.truc_toi, '#3730a3'],
      ['+ Tối ưu KD', p.toi_uu_kd, '#155e75'],
    ];
    const tru = [
      ['− BHXH (10.5%)', p.bhxh_tru, '#991b1b'],
      ['− Đoàn phí công đoàn', p.doan_phi_tru, '#dc2626'],
      ['− Ứng lương' + (p.ung_luong_so_lan?` (${p.ung_luong_so_lan} lần)`:''), p.ung_luong||0, '#b91c1c'],
    ];
    $('me-payroll-detail').innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <tbody>
          <tr><td colspan="2" style="padding:9px 12px;background:#dbeafe;color:#1e40af;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.3px">Khoản cộng (tổng: ${fmtVnd(p.tong_cong)}đ)</td></tr>
          ${cong.map(([l,v,c]) => rowKv(l,v,c)).join('')}
          <tr><td colspan="2" style="padding:9px 12px;background:#fee2e2;color:#991b1b;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.3px">Khoản trừ (tổng: ${fmtVnd(p.tong_tru)}đ)</td></tr>
          ${tru.map(([l,v,c]) => rowKv(l,v,c)).join('')}
          <tr style="background:#f0fdf4">
            <td style="padding:14px 12px;font-weight:800;color:#15803d;font-size:14px">💰 Lương thực nhận</td>
            <td style="padding:14px 12px;text-align:right;font-weight:900;color:#15803d;font-size:18px;font-variant-numeric:tabular-nums">${fmtVnd(p.luong_thuc_nhan)}đ</td>
          </tr>
        </tbody>
      </table>
    `;
    renderMyChamCong(d.cham_cong || [], y, m);
  } catch(e){
    $('me-summary').innerHTML = '';
    $('me-payroll-detail').innerHTML = `<div class="empty" style="color:#dc2626">⚠ ${esc(e.message)}</div>`;
    $('me-cham-cong-calendar').innerHTML = '';
  }
}

function renderMyChamCong(items, y, m){
  const wrap = $('me-cham-cong-calendar');
  const ccMap = {};
  for(const c of items){ ccMap[c.ngay] = c; }
  const ndays = new Date(parseInt(y), parseInt(m), 0).getDate();
  let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11.5px">';
  const dayNames = ['T2','T3','T4','T5','T6','T7','CN'];
  dayNames.forEach(d => html += `<div style="font-weight:800;color:#475569;text-align:center;padding:6px;min-width:0">${d}</div>`);
  const firstDay = new Date(parseInt(y), parseInt(m)-1, 1);
  const firstWeekday = (firstDay.getDay() + 6) % 7;  // T2=0..CN=6
  for(let i = 0; i < firstWeekday; i++) html += '<div></div>';
  let totalHours = 0, daysWorked = 0;
  for(let d = 1; d <= ndays; d++){
    const date = `${y}-${m}-${String(d).padStart(2,'0')}`;
    const cc = ccMap[date];
    const dayOfWeek = (new Date(parseInt(y), parseInt(m)-1, d).getDay() + 6) % 7;
    const isSunday = dayOfWeek === 6;
    let bg = '#f8fafc', col = '#94a3b8', content = '';
    if(cc && cc.tong_gio > 0){
      totalHours += cc.tong_gio;
      daysWorked++;
      const pct = Math.min(100, cc.tong_gio / 8 * 100);
      bg = pct >= 100 ? '#dcfce7' : (pct >= 50 ? '#fef3c7' : '#fee2e2');
      col = pct >= 100 ? '#15803d' : (pct >= 50 ? '#92400e' : '#991b1b');
      content = `<div style="font-size:10px;font-weight:700">${cc.tong_gio.toFixed(1)}h</div>` +
                (cc.gio_vao ? `<div style="font-size:9px;opacity:.85">${cc.gio_vao}-${cc.gio_ra||'?'}</div>` : '');
    } else if(isSunday){
      bg = '#e0e7ff'; col = '#3730a3';
    }
    html += `<div style="background:${bg};color:${col};padding:7px 4px;border-radius:7px;min-height:50px;min-width:0;overflow:hidden;text-align:center;line-height:1.3">
      <div style="font-weight:800;font-size:13px">${d}</div>
      ${content}
    </div>`;
  }
  html += '</div>';
  html = `<div style="margin-bottom:10px;font-size:12px;color:#475569"><strong>${daysWorked} ngày làm việc</strong> • <strong>${totalHours.toFixed(1)}h</strong> tổng • TB ${daysWorked?(totalHours/daysWorked).toFixed(1):'0'}h/ngày</div>` + html;
  wrap.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════════════════
// Hồ sơ của tôi (NV view only)
// ═══════════════════════════════════════════════════════════════════════════
async function loadMyProfile() {
  try {
    const p = await api('GET', '/api/profile-workflow/me');
    _meProfile = p;
    renderMyBanner(p);
    renderMyContent(p);
  } catch (e) {
    $('me-content').innerHTML = `<div class="card"><div class="empty" style="color:#dc2626">⚠ ${esc(e.message)}</div></div>`;
  }
}

function renderMyBanner(p) {
  const s = p.profile_status;
  let html = '';
  if (s === 'chua_nop') {
    const haveLoai = new Set((p.documents || []).map(d => d.loai_giay_to));
    const missing = _loaiOptions.filter(o => o.required && !haveLoai.has(o.value)).map(o => o.label);
    const docTxt = missing.length ? `<br>📎 Còn thiếu: <b>${missing.map(esc).join(', ')}</b>` : '';
    html = `<div class="banner banner-info">📝 <div>Hồ sơ <b>chưa hoàn thiện</b> — vui lòng điền đủ thông tin + upload tài liệu bắt buộc → nhấn <b>"Gửi xét duyệt"</b>.${docTxt}</div></div>`;
  } else if (s === 'cho_duyet') {
    html = `<div class="banner banner-warn">⏳ <div>Hồ sơ đã gửi <b>${fmtDate(p.profile_submitted_at)}</b> — đang chờ HCNS duyệt. Form đã khoá.</div></div>`;
  } else if (s === 'da_duyet') {
    html = `<div class="banner banner-success">✓ <div>Hồ sơ đã được HCNS <b>duyệt ${fmtDate(p.profile_approved_at)}</b> bởi <b>${esc(p.profile_approved_by || '—')}</b>. Liên hệ HCNS để cập nhật.</div></div>`;
  }
  $('me-banner').innerHTML = html;
}

function renderMyContent(p) {
  const editable = p.profile_status === 'chua_nop';
  const ro = editable ? '' : 'disabled';
  $('me-content').innerHTML = `
    <div class="card">
      <div class="card-h">📋 Thông tin cá nhân</div>
      <div class="form-grid">
        <div class="field"><label>Mã NV</label><input value="${esc(p.ma_nv)}" disabled></div>
        <div class="field"><label>Username</label><input value="${esc(p.username || '')}" disabled></div>
        <div class="field"><label>Họ tên <span class="req">*</span></label><input id="f-ho_ten" value="${esc(p.ho_ten || '')}" ${ro}></div>
        <div class="field"><label>Ngày sinh <span class="req">*</span></label><input id="f-ngay_sinh" type="date" value="${p.ngay_sinh || ''}" ${ro}></div>
        <div class="field"><label>Giới tính <span class="req">*</span></label>
          <select id="f-gioi_tinh" ${ro}>
            <option value="">—</option>
            <option value="Nam" ${p.gioi_tinh==='Nam'?'selected':''}>Nam</option>
            <option value="Nữ" ${p.gioi_tinh==='Nữ'?'selected':''}>Nữ</option>
            <option value="Khác" ${p.gioi_tinh==='Khác'?'selected':''}>Khác</option>
          </select></div>
        <div class="field"><label>CCCD/CMND <span class="req">*</span></label><input id="f-cccd" value="${esc(p.cccd || '')}" ${ro}></div>
        <div class="field"><label>Điện thoại <span class="req">*</span></label><input id="f-dien_thoai" value="${esc(p.dien_thoai || '')}" ${ro}></div>
        <div class="field"><label>Email</label><input id="f-email" type="email" value="${esc(p.email || '')}" ${ro}></div>
        <div class="field" style="grid-column:span 2"><label>Địa chỉ <span class="req">*</span></label><textarea id="f-dia_chi" ${ro}>${esc(p.dia_chi || '')}</textarea></div>
        <div class="field"><label>Phòng ban</label><input value="${esc(p.phong_ban || '')}" disabled></div>
        <div class="field"><label>Chức vụ</label><input value="${esc(p.chuc_vu || '')}" disabled></div>
      </div>
      ${editable ? `<div class="btn-row"><button class="btn btn-primary" onclick="saveMyInfo()">💾 Lưu thông tin</button></div>` : ''}
    </div>

    <div class="card">
      <div class="card-h">📎 Tài liệu cá nhân
        <span style="margin-left:auto;font-weight:500;font-size:11px;color:#64748b;text-transform:none">
          Tài liệu có dấu <span style="background:#dc2626;color:#fff;padding:1px 5px;border-radius:3px;font-size:9px">BẮT BUỘC</span> là cần thiết khi gửi xét duyệt
        </span>
      </div>
      <div class="docs-grid" id="me-docs">${renderMyDocs(p)}</div>
      ${renderUploadArea(p)}
    </div>

    ${p.profile_status === 'chua_nop' ? `
      <div class="card" style="border:2px solid #1a6e4b;background:#f0fdf4">
        <div style="text-align:center;font-size:13px;color:#065f46;margin-bottom:10px">
          📤 Sau khi điền đủ thông tin + upload đủ tài liệu bắt buộc → nhấn nút để gửi cho HCNS duyệt:
        </div>
        <div style="text-align:center">
          <button class="btn btn-primary" style="padding:11px 28px;font-size:14px" onclick="submitMyProfile()">
            📨 Gửi xét duyệt
          </button>
        </div>
      </div>
    ` : ''}
  `;
}

function renderMyDocs(p) {
  const docs = p.documents || [];
  if (!docs.length) return '<div class="empty">Chưa có tài liệu — upload bên dưới</div>';
  return docs.map(d => {
    // Chỉ xoá được doc CHƯA DUYỆT (đã duyệt → liên hệ HCNS)
    const canDelete = d.trang_thai !== 'da_duyet';
    return `<div class="doc-card has-file">
      <div class="doc-type">📄 ${esc(d.loai_label)}</div>
      <div class="doc-file-info">
        <b>${esc(d.ten_file || '—')}</b><br>
        ${fmtSize(d.file_size)} · ${fmtShortDate(d.ngay_upload)}<br>
        <span class="status-badge status-${d.trang_thai}">${d.trang_thai === 'da_duyet' ? '✓ Đã duyệt' : d.trang_thai === 'tu_choi' ? '✗ Từ chối' : '⏳ Chờ duyệt'}</span>
      </div>
      ${d.ghi_chu_hcns ? `<div style="font-size:10px;color:#92400e;background:#fef3c7;padding:4px 7px;border-radius:4px;margin-top:5px"><b>HCNS:</b> ${esc(d.ghi_chu_hcns)}</div>` : ''}
      <div class="doc-actions">
        <a href="${esc(d.file_url)}" target="_blank" class="btn btn-secondary" style="font-size:11px;padding:4px 10px">👁 Xem</a>
        ${canDelete ? `<button class="btn btn-danger" style="font-size:11px;padding:4px 10px" onclick="deleteMyDoc(${d.id})">🗑 Xoá</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderUploadArea(p) {
  // KHÔNG filter "remaining" — cho phép upload nhiều bản cùng loại (bổ sung, sửa đổi)
  const isApproved = p.profile_status === 'da_duyet';
  const noticeHtml = isApproved
    ? `<div style="background:#dbeafe;color:#1e40af;padding:8px 11px;border-radius:7px;font-size:11px;margin-bottom:8px;border-left:3px solid #3b82f6">
         💡 Hồ sơ đã duyệt — tài liệu mới upload sẽ ở trạng thái <b>"Chờ duyệt"</b> và HCNS sẽ duyệt riêng từng file.
       </div>`
    : '';
  return `<div style="margin-top:14px">
    <div style="font-weight:700;font-size:12px;color:#1a3c5e;margin-bottom:8px;text-transform:uppercase">➕ Upload tài liệu mới</div>
    ${noticeHtml}
    <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap">
      <div class="field" style="flex:1;min-width:200px">
        <label>Loại tài liệu</label>
        <select id="upload-loai">
          ${_loaiOptions.map(o => `<option value="${esc(o.value)}">${esc(o.label)}${o.required ? ' *' : ''}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="flex:2;min-width:240px">
        <label>File (PDF/JPG/PNG, ≤20MB)</label>
        <input id="upload-file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp">
      </div>
      <button class="btn btn-primary" onclick="uploadMyDoc()">📤 Upload</button>
    </div>
  </div>`;
}

async function saveMyInfo() {
  const body = {
    ho_ten:     $('f-ho_ten').value.trim(),
    ngay_sinh:  $('f-ngay_sinh').value || null,
    gioi_tinh:  $('f-gioi_tinh').value || null,
    cccd:       $('f-cccd').value.trim() || null,
    dien_thoai: $('f-dien_thoai').value.trim() || null,
    email:      $('f-email').value.trim() || null,
    dia_chi:    $('f-dia_chi').value.trim() || null,
  };
  try {
    await api('PUT', '/api/profile-workflow/me', body);
    toast('✓ Đã lưu thông tin');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function uploadMyDoc() {
  const loai = $('upload-loai').value;
  const file = $('upload-file').files[0];
  if (!file) { toast('Chọn file trước', true); return; }
  const fd = new FormData();
  fd.append('loai_giay_to', loai);
  fd.append('file', file);
  try {
    await api('POST', '/api/profile-workflow/me/documents', fd, true);
    toast('✓ Upload thành công');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function deleteMyDoc(id) {
  if (!confirm('Xoá tài liệu này?')) return;
  try {
    await api('DELETE', '/api/profile-workflow/me/documents/' + id);
    toast('✓ Đã xoá');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

async function submitMyProfile() {
  if (!confirm('Gửi hồ sơ để HCNS duyệt? Sau khi gửi, anh sẽ không tự sửa được nữa.')) return;
  try {
    await api('POST', '/api/profile-workflow/me/submit');
    toast('✓ Đã gửi cho HCNS');
    await loadMyProfile();
  } catch (e) { toast('Lỗi: ' + e.message, true); }
}

// ═══════════════════════════════════════════════════════════════════════════
// Đổi mật khẩu
// ═══════════════════════════════════════════════════════════════════════════
function _pwShowMsg(text, ok) {
  const el = $('pw-msg');
  el.style.display = 'block';
  el.style.background = ok ? '#d1fae5' : '#fee2e2';
  el.style.color = ok ? '#065f46' : '#991b1b';
  el.textContent = text;
}
async function submitChangePwd() {
  const cur = $('pw-cur').value;
  const nw  = $('pw-new').value;
  const cfm = $('pw-cfm').value;
  if (!cur || !nw || !cfm) { _pwShowMsg('⚠ Vui lòng điền đầy đủ', false); return; }
  if (nw !== cfm)          { _pwShowMsg('⚠ Mật khẩu mới và xác nhận không khớp', false); return; }
  if (nw.length < 6)       { _pwShowMsg('⚠ Mật khẩu mới phải ít nhất 6 ký tự', false); return; }
  const btn = $('pw-submit');
  btn.disabled = true; btn.textContent = 'Đang xử lý...';
  try {
    const r = await fetch('/api/profile', {
      method: 'PUT', headers: {'Content-Type':'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({ action: 'change_password', current_password: cur, new_password: nw, confirm_password: cfm }),
    });
    if (r.status === 401) { _pwShowMsg('⚠ Phiên đăng nhập hết — vui lòng login lại', false); return; }
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      _pwShowMsg('✅ Đổi mật khẩu thành công', true);
      $('pw-cur').value = ''; $('pw-new').value = ''; $('pw-cfm').value = '';
      toast('✓ Đã đổi mật khẩu');
    } else {
      _pwShowMsg('⚠ ' + (d.error || d.detail || ('HTTP ' + r.status)), false);
    }
  } catch (e) {
    _pwShowMsg('⚠ Lỗi: ' + (e.message || e), false);
  } finally {
    btn.disabled = false; btn.textContent = '🔑 Đổi mật khẩu';
  }
}

</script>
</body>
