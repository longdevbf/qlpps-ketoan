{% if user %}
<script>
window.currentUsername       = {{ (user.ten_dang_nhap or '') | tojson }};
window.currentUserDisplayName = {{ (user.ho_ten or user.ten_dang_nhap or 'Tôi') | tojson }};
</script>
{% endif %}
<style>
/* ============================================================
   ZALO V2 CHAT WIDGET — SKELETON CSS
   Scope: #_chat_widget_root (palette vars) + #_chat_panel layout
   ============================================================ */

#_chat_widget_root {
  --z-blue: #0084FF;
  --z-blue-dark: var(--brand);
  --z-blue-darker: var(--brand);
  --z-bg: var(--bg-page);
  --z-white: #FFFFFF;
  --z-border: var(--border);
  --z-text: var(--text-1);
  --z-muted: var(--text-3);
  --z-hover: var(--bg-page);
  --z-active: var(--brand-soft);
  --z-badge: var(--danger);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  color: var(--z-text);
  font-size: 14px;
}

#_chat_widget_root *,
#_chat_widget_root *::before,
#_chat_widget_root *::after {
  box-sizing: border-box;
}

/* ============================================================
   FAB (giữ ID cũ #_chat_fab — base.html không cần đổi)
   ============================================================ */
#_chat_fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--z-blue) 0%, var(--z-blue-dark) 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0, 132, 255, .35), 0 2px 6px rgba(0, 0, 0, .12);
  z-index: 99998;
  user-select: none;
  transition: transform .18s ease, box-shadow .18s ease;
  border: none;
}
#_chat_fab:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 10px 26px rgba(0, 132, 255, .42), 0 3px 8px rgba(0, 0, 0, .16);
}
#_chat_fab:active { transform: translateY(0) scale(.98); }
#_chat_fab .zV2_fab_badge {
  position: absolute;
  top: -2px;
  right: -2px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 10px;
  background: var(--z-badge);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: none;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
}
#_chat_fab.has-unread .zV2_fab_badge { display: inline-flex; }

/* ============================================================
   PANEL — 3 column desktop
   ============================================================ */
#_chat_panel {
  position: fixed;
  top: 16px;
  right: 16px;
  bottom: 16px;
  width: min(1080px, calc(100vw - 32px));
  height: auto;
  max-height: calc(100vh - 32px);
  background: var(--z-white);
  border-radius: 14px;
  overflow: hidden;
  display: none;
  flex-direction: row;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .22), 0 8px 24px rgba(0, 0, 0, .10);
  z-index: 99999;
  transform-origin: bottom right;
}
#_chat_panel.open {
  display: flex;
  animation: zV2_slideup .28s cubic-bezier(.4, 0, .2, 1);
}
@keyframes zV2_slideup {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ============================================================
   LEFT RAIL (64px)
   ============================================================ */
#zV2_rail {
  width: 64px;
  background: var(--z-blue-darker);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 8px;
  flex-shrink: 0;
}
#zV2_rail_logo {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  margin-bottom: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.zV2_rail_btn {
  position: relative;
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s ease;
}
.zV2_rail_btn:hover { background: rgba(255, 255, 255, .10); }
.zV2_rail_btn.active { background: rgba(255, 255, 255, .20); }
.zV2_rail_btn.active::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 2px;
  background: #fff;
}
.zV2_rail_btn .zV2_rail_tooltip {
  position: absolute;
  left: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--text-1);
  color: #fff;
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s ease;
  z-index: 5;
}
.zV2_rail_btn:hover .zV2_rail_tooltip { opacity: 1; }
.zV2_rail_btn .zV2_rail_badge {
  position: absolute;
  top: 4px;
  right: 4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--z-badge);
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  display: none;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--z-blue-darker);
}
.zV2_rail_btn.has-unread .zV2_rail_badge { display: inline-flex; }
#zV2_rail_spacer { flex: 1; }

/* ============================================================
   MIDDLE COLUMN (320px) — conv list / contacts
   ============================================================ */
#zV2_col_middle {
  width: 320px;
  flex-shrink: 0;
  background: var(--z-white);
  border-right: 1px solid var(--z-border);
  display: flex;
  flex-direction: column;
  min-width: 0;
}

#zV2_mid_header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  border-bottom: 1px solid var(--z-border);
  flex-shrink: 0;
}
#zV2_mid_header_avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--z-active);
  color: var(--z-blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  flex-shrink: 0;
}
#zV2_mid_header_avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#zV2_mid_header_name {
  flex: 1;
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#zV2_btn_new_group {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--z-text);
  transition: background .12s ease;
}
#zV2_btn_new_group:hover { background: var(--z-hover); }

#zV2_search_wrap {
  height: 44px;
  padding: 6px 12px;
  flex-shrink: 0;
}
#zV2_search_box {
  width: 100%;
  height: 32px;
  border-radius: 16px;
  border: none;
  background: var(--z-hover);
  padding: 0 14px;
  font-size: 13px;
  color: var(--z-text);
  outline: none;
  transition: background .12s ease, box-shadow .12s ease;
}
#zV2_search_box::placeholder { color: var(--z-muted); }
#zV2_search_box:focus {
  background: var(--z-white);
  box-shadow: 0 0 0 1px var(--z-blue) inset;
}

#zV2_tabs_filter {
  height: 36px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.zV2_tab_filter_btn {
  height: 26px;
  padding: 0 12px;
  border-radius: 13px;
  background: transparent;
  border: none;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--z-muted);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.zV2_tab_filter_btn:hover { background: var(--z-hover); color: var(--z-text); }
.zV2_tab_filter_btn.active {
  background: var(--z-active);
  color: var(--z-blue);
}

#zV2_conv_list,
#zV2_contacts_list {
  flex: 1 1 0;
  min-height: 0; /* cho phép flex shrink để scroll hoạt động */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0;
}
#zV2_contacts_list { display: none; }

.zV2_conv_item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  cursor: pointer;
  transition: background .12s ease;
}
.zV2_conv_item:hover { background: var(--z-hover); }
.zV2_conv_item.active { background: var(--z-active); }
.zV2_conv_avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--z-active);
  color: var(--z-blue);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 15px;
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
}
.zV2_conv_avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.zV2_conv_avatar .zV2_online_dot {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--success);
  border: 2px solid #fff;
}
.zV2_conv_body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.zV2_conv_name_row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.zV2_conv_name {
  font-weight: 500;
  font-size: 14px;
  color: var(--z-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.zV2_conv_time {
  font-size: 11.5px;
  color: var(--z-muted);
  flex-shrink: 0;
}
.zV2_conv_preview_row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.zV2_conv_preview {
  font-size: 13px;
  color: var(--z-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* === UNREAD state cho conv item (Zalo-style highlight) === */
.zV2_conv_item--unread .zV2_conv_name {
  font-weight: 700 !important;
  color: var(--text-1) !important;
}
.zV2_conv_item--unread .zV2_conv_preview {
  color: var(--text-1) !important;
  font-weight: 600 !important;
}
.zV2_conv_item--unread .zV2_conv_time {
  color: #0068FF !important;
  font-weight: 700 !important;
}
.zV2_conv_item--unread .zV2_conv_avatar {
  box-shadow: 0 0 0 2px var(--danger);
}
.zV2_conv_badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--danger);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
/* Background nhẹ cho item chưa đọc */
.zV2_conv_item--unread:not(.zV2_conv_item--active) {
  background: rgba(0, 104, 255, 0.04);
}

/* ============================================================
   MAIN COLUMN (flex:1)
   ============================================================ */
#zV2_col_main {
  flex: 1;
  background: var(--z-bg);
  display: flex;
  flex-direction: column;
  position: relative;
  min-width: 0;
}

#zV2_main_header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 60px 0 16px; /* right padding chừa chỗ cho close btn (top-right panel) */
  gap: 12px;
  background: var(--z-white);
  border-bottom: 1px solid var(--z-border);
  flex-shrink: 0;
  z-index: 3;
}
#zV2_main_back_btn {
  display: none;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: transparent;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--z-text);
  align-items: center;
  justify-content: center;
}
#zV2_main_back_btn:hover { background: var(--z-hover); }
#zV2_main_avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--z-active);
  color: var(--z-blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 14px;
  overflow: hidden;
  flex-shrink: 0;
}
#zV2_main_avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#zV2_main_titlewrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
#zV2_main_title {
  font-weight: 600;
  font-size: 15px;
  color: var(--z-text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#zV2_main_meta {
  font-size: 12px;
  color: var(--z-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#zV2_main_actions {
  display: flex;
  align-items: center;
  gap: 4px;
}
.zV2_main_action_btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: transparent;
  border: none;
  font-size: 17px;
  cursor: pointer;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s ease;
}
.zV2_main_action_btn:hover { background: var(--z-hover); color: var(--z-blue); }
.zV2_main_action_btn > * { pointer-events: none; } /* click luôn rơi vào button, không bị SVG ăn */
.zV2_main_action_btn.active { background: var(--z-active); color: var(--z-blue); }

#zV2_messages_scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  /* Cuộn mượt: chỉ áp dụng smooth cho scrollTo programmatic, để wheel/trackpad tự do bằng auto */
  scroll-behavior: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  will-change: scroll-position;
}
/* Scroll perf nhẹ (KHÔNG dùng transform vì gây layout bug trên iOS Safari) */
.zV2_msg_row { contain: layout style; }
/* Optimistic messages (chưa được server confirm) */
.zV2_msg_row[data-msg-id^="-"] .zV2_bubble { opacity: 0.65; }
#zV2_messages_inner {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 100%;
}

#zV2_typing_indicator {
  position: absolute;
  bottom: 88px;
  left: 16px;
  background: var(--z-white);
  color: var(--z-muted);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
  display: none;
  align-items: center;
  gap: 6px;
  z-index: 4;
}
#zV2_typing_indicator.visible { display: flex; }
#zV2_typing_indicator .zV2_dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--z-muted);
  animation: zV2_blink 1.2s infinite ease-in-out;
}
#zV2_typing_indicator .zV2_dot:nth-child(2) { animation-delay: .2s; }
#zV2_typing_indicator .zV2_dot:nth-child(3) { animation-delay: .4s; }
@keyframes zV2_blink {
  0%, 60%, 100% { opacity: .3; }
  30% { opacity: 1; }
}

#zV2_scroll_bottom_btn {
  position: absolute;
  bottom: 100px;
  right: 16px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--z-white);
  border: 1px solid var(--z-border);
  color: var(--z-text);
  font-size: 16px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
  z-index: 4;
}
#zV2_scroll_bottom_btn.visible { display: flex; }
#zV2_scroll_bottom_btn:hover { background: var(--z-hover); }
#zV2_scroll_bottom_btn .zV2_scroll_badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--z-badge);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: none;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
}
#zV2_scroll_bottom_btn.has-unread .zV2_scroll_badge { display: inline-flex; }

/* ============================================================
   REPLY STRIP & COMPOSER
   ============================================================ */
/* ── Paste image preview (hiện trước khi gửi) ── */
#zV2_paste_preview {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--brand-soft);
  border-top: 1px solid var(--z-border);
  flex-shrink: 0;
}
#zV2_paste_preview.visible { display: flex; }
#zV2_paste_thumb {
  height: 56px;
  width: auto;
  max-width: 80px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--z-border);
}
#zV2_paste_meta { flex: 1; min-width: 0; }
#zV2_paste_name {
  font-size: 12px;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#zV2_paste_hint { font-size: 11px; color: var(--z-muted); margin-top: 2px; }
#zV2_paste_clear {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--z-muted);
  font-size: 18px;
  padding: 4px 6px;
  border-radius: 6px;
  line-height: 1;
  flex-shrink: 0;
}
#zV2_paste_clear:hover { background: var(--z-hover); color: var(--z-text); }

#zV2_reply_strip {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--z-white);
  border-top: 1px solid var(--z-border);
  font-size: 12.5px;
}
#zV2_reply_strip.visible { display: flex; }
#zV2_reply_strip .zV2_reply_bar {
  width: 3px;
  align-self: stretch;
  border-radius: 2px;
  background: var(--z-blue);
}
#zV2_reply_strip .zV2_reply_body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
#zV2_reply_strip .zV2_reply_to {
  color: var(--z-blue);
  font-weight: 600;
  font-size: 11.5px;
}
#zV2_reply_strip .zV2_reply_text {
  color: var(--z-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#zV2_reply_strip .zV2_reply_close {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--z-muted);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#zV2_reply_strip .zV2_reply_close:hover { background: var(--z-hover); }

#zV2_compose_wrap {
  padding: 12px;
  background: var(--z-white);
  border-top: 1px solid var(--z-border);
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex-shrink: 0;

  position: relative;}
#zV2_compose_tools {
  display: flex;
  align-items: center;
  gap: 2px;
}
.zV2_compose_tool_btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text-2);
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s ease, color .12s ease, transform .1s ease;
}
.zV2_compose_tool_btn:hover { background: var(--z-hover); color: var(--z-blue); }
.zV2_compose_tool_btn:active { transform: scale(.92); }

#zV2_compose_row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
#zV2_compose_input {
  flex: 1;
  min-height: 40px;
  max-height: 140px;
  padding: 10px 16px;
  border-radius: 22px;
  background: var(--z-hover);
  border: none;
  outline: none;
  resize: none;
  font-size: 14px;
  line-height: 1.4;
  color: var(--z-text);
  font-family: inherit;
  transition: background .12s ease;
}
#zV2_compose_input::placeholder { color: var(--z-muted); }
#zV2_compose_input:focus { background: var(--bg-page); }

#zV2_compose_send_wrap {
  position: relative;
  width: 40px;
  height: 40px;
  flex-shrink: 0;
}
#zV2_thumbs_btn,
#zV2_send_btn {
  position: absolute;
  inset: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: #fff;
  background: linear-gradient(135deg, var(--z-blue) 0%, var(--z-blue-dark) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
#zV2_thumbs_btn:hover,
#zV2_send_btn:hover {
  transform: scale(1.06);
  box-shadow: 0 4px 12px rgba(0, 132, 255, .35);
}
#zV2_send_btn { display: none; }
#zV2_compose_send_wrap.has-text #zV2_send_btn { display: flex; }
#zV2_compose_send_wrap.has-text #zV2_thumbs_btn { display: none; }
#zV2_thumbs_btn > *, #zV2_send_btn > * { pointer-events: none; }

/* Mobile: nút gửi to hơn để dễ chạm */
@media (max-width: 599px) {
  #zV2_compose_send_wrap { width: 44px; height: 44px; }
  #zV2_thumbs_btn, #zV2_send_btn { width: 44px; height: 44px; }
  #zV2_compose_input { min-height: 44px; font-size: 16px; padding: 11px 16px; }
  #zV2_compose_tools { padding: 2px 0; }
  .zV2_compose_tool_btn { width: 40px; height: 40px; }
  /* Nâng FAB lên cao hơn để không đè lên nội dung */
  #_chat_fab { bottom: 80px !important; right: 16px !important; }
}

/* ============================================================
   MESSAGE BUBBLES
   ============================================================ */
.zV2_msg_row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 1px 0;
  position: relative;
}
.zV2_msg_row--own { flex-direction: row-reverse; }
.zV2_msg_row--first_of_group { margin-top: 10px; }
.zV2_msg_row--last_of_group { margin-bottom: 10px; }
.zV2_msg_avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--z-active);
  color: var(--z-blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
  overflow: hidden;
  flex-shrink: 0;
  visibility: visible;
}
/* avatar always visible for other users */
.zV2_msg_row--own .zV2_msg_avatar { display: none; }
.zV2_msg_avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.zV2_msg_avatar_initial {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  line-height: 1;
}
/* @mention highlight trong tin nhắn */
.zV2_mention {
  color: #1d4ed8;
  font-weight: 600;
  background: #dbeafe;
  border-radius: 3px;
  padding: 0 3px;
  cursor: pointer;
}
.zV2_mention:hover { background: var(--brand-soft); }
/* Mention dropdown */
#zV2_mention_dd {
  position: absolute;
  bottom: 100%;
  left: 0;
  right: 0;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 10px 10px 0 0;
  box-shadow: 0 -4px 16px rgba(0,0,0,.1);
  max-height: 220px;
  overflow-y: auto;
  display: none;
  z-index: 10;
}
#zV2_mention_dd.open { display: block; }
.zV2_mention_item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  transition: background .1s;
}
.zV2_mention_item:hover, .zV2_mention_item.active { background: var(--brand-soft); }
.zV2_mention_item_ava {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.zV2_mention_item_name { font-weight: 600; color: var(--brand); }
.zV2_mention_item_dept { font-size: 11px; color: var(--text-3); }
/* avatar always visible */
.zV2_msg_row--own .zV2_msg_avatar { display: none; }

.zV2_msg_body {
  display: flex;
  flex-direction: column;
  max-width: 70%;
  position: relative;
}
.zV2_msg_row--own .zV2_msg_body { align-items: flex-end; }

.zV2_msg_sender {
  font-size: 11.5px;
  color: var(--z-muted);
  padding: 0 14px 2px;
  display: none;
}
.zV2_msg_row--first_of_group:not(.zV2_msg_row--own) .zV2_msg_sender { display: block; }

.zV2_bubble {
  position: relative;
  max-width: 100%;
  background: var(--z-white);
  color: var(--z-text);
  padding: 9px 14px;
  border-radius: 18px 18px 18px 4px;
  font-size: 14px;
  line-height: 1.5;
  word-wrap: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
}
.zV2_msg_row--own .zV2_bubble {
  background: linear-gradient(135deg, var(--z-blue) 0%, var(--z-blue-dark) 100%);
  color: #fff;
  border-radius: 18px 18px 4px 18px;
}
.zV2_bubble a { color: inherit; text-decoration: underline; }
.zV2_bubble--recalled {
  font-style: italic;
  color: var(--z-muted);
  background: transparent !important;
  border: 1px dashed var(--z-border);
  box-shadow: none;
}
.zV2_bubble--edited::after {
  content: " (đã chỉnh sửa)";
  font-size: 11px;
  color: var(--z-muted);
  font-style: italic;
}
.zV2_msg_row--own .zV2_bubble--edited::after { color: rgba(255, 255, 255, .75); }

.zV2_bubble_reply_quote {
  background: rgba(0, 0, 0, .05);
  border-left: 3px solid var(--z-blue);
  padding: 5px 8px;
  margin-bottom: 6px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--z-muted);
}
.zV2_msg_row--own .zV2_bubble_reply_quote {
  background: rgba(255, 255, 255, .18);
  border-left-color: #fff;
  color: rgba(255, 255, 255, .9);
}

.zV2_bubble_reactions {
  position: absolute;
  bottom: -10px;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--z-white);
  border: 1px solid var(--z-border);
  padding: 1px 6px;
  border-radius: 12px;
  font-size: 11px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
  z-index: 1;
}
.zV2_msg_row:not(.zV2_msg_row--own) .zV2_bubble_reactions { right: 8px; }
.zV2_msg_row--own .zV2_bubble_reactions { left: 8px; }

.zV2_msg_actions {
  position: absolute;
  bottom: 100%;
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--z-white);
  border: 1px solid var(--z-border);
  border-radius: 18px;
  padding: 2px 4px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
  opacity: 0;
  pointer-events: none;
  transition: opacity .12s ease;
  z-index: 2;
}
.zV2_msg_row:not(.zV2_msg_row--own) .zV2_msg_actions { left: 8px; }
.zV2_msg_row--own .zV2_msg_actions { right: 8px; }
.zV2_msg_row:hover .zV2_msg_actions {
  opacity: 1;
  pointer-events: auto;
}
.zV2_msg_action_btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 14px;
  color: var(--z-text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .10s ease;
}
.zV2_msg_action_btn:hover { background: var(--z-hover); color: var(--z-blue); }
.zV2_msg_action_btn > * { pointer-events: none; }

.zV2_msg_time {
  font-size: 11px;
  color: var(--z-muted);
  margin-top: 3px;
  padding: 0 4px;
  opacity: 0;
  transition: opacity .12s ease;
}
.zV2_msg_row:hover .zV2_msg_time { opacity: 1; }
.zV2_msg_row--last_of_group .zV2_msg_time { opacity: 1; }

.zV2_msg_status {
  font-size: 11px;
  color: var(--z-muted);
  margin-top: 2px;
  padding: 0 4px;
}

/* Date divider */
.zV2_date_divider {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  font-size: 11.5px;
  text-transform: uppercase;
  color: var(--z-muted);
  letter-spacing: .3px;
  font-weight: 500;
}
.zV2_date_divider::before,
.zV2_date_divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--z-border);
}

/* System message */
.zV2_sys_msg {
  text-align: center;
  font-size: 12px;
  color: var(--z-muted);
  padding: 6px 0;
}

/* Empty states */
#zV2_empty_main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--z-muted);
  text-align: center;
  padding: 40px 24px;
  gap: 12px;
}
#zV2_empty_main .zV2_empty_icon {
  font-size: 60px;
  opacity: .55;
}
#zV2_empty_main .zV2_empty_title {
  font-size: 17px;
  font-weight: 600;
  color: var(--z-text);
}
#zV2_empty_main .zV2_empty_sub {
  font-size: 13.5px;
  color: var(--z-muted);
  max-width: 340px;
  line-height: 1.5;
}
#zV2_empty_list {
  padding: 40px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--z-muted);
}

/* ============================================================
   INFO PANEL (slide-in from right inside main column)
   ============================================================ */
#zV2_info_panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 340px;
  background: var(--z-white);
  border-left: 1px solid var(--z-border);
  z-index: 10;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4, 0, .2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: -4px 0 18px rgba(0, 0, 0, .06);
}
#zV2_info_panel.open { transform: translateX(0); }
#zV2_info_header {
  height: 60px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
  border-bottom: 1px solid var(--z-border);
  flex-shrink: 0;
}
#zV2_info_title {
  flex: 1;
  font-weight: 600;
  font-size: 15px;
}
#zV2_info_close_btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 17px;
  color: var(--z-text);
  display: flex;
  align-items: center;
  justify-content: center;
}
#zV2_info_close_btn:hover { background: var(--z-hover); }
#zV2_info_tabs {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--z-border);
  flex-shrink: 0;
}
.zV2_info_tab_btn {
  flex: 1;
  height: 40px;
  background: transparent;
  border: none;
  font-size: 12.5px;
  color: var(--z-muted);
  font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: color .12s ease;
}
.zV2_info_tab_btn:hover { color: var(--z-text); }
.zV2_info_tab_btn.active { color: var(--z-blue); }
.zV2_info_tab_btn.active::after {
  content: "";
  position: absolute;
  left: 14%;
  right: 14%;
  bottom: -1px;
  height: 2px;
  border-radius: 2px;
  background: var(--z-blue);
}
#zV2_info_body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}
.zV2_info_tab_panel { display: none; }
.zV2_info_tab_panel.active { display: block; }

/* ============================================================
   CLOSE PANEL BUTTON (top right of panel above main header)
   ============================================================ */
#zV2_panel_close_btn {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--z-white);
  border: 1px solid var(--z-border);
  cursor: pointer;
  font-size: 15px;
  color: var(--z-text);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
}
#zV2_panel_close_btn:hover { background: var(--z-hover); }

/* ============================================================
   RESPONSIVE — tablet 600..1023px
   ============================================================ */
@media (min-width: 600px) and (max-width: 1023px) {
  #_chat_panel {
    width: calc(100vw - 24px);
    top: 12px;
    right: 12px;
    bottom: 12px;
    max-height: calc(100vh - 24px);
  }
  #zV2_rail { display: none; }
  #zV2_col_middle { width: 280px; }
}

/* ============================================================
   RESPONSIVE — mobile <600px
   ============================================================ */
@media (max-width: 599px) {
  #_chat_panel {
    inset: 0;
    width: 100vw;
    height: 100vh;        /* fallback */
    height: 100dvh;       /* dynamic viewport, override khi support */
    max-height: 100dvh;
    border-radius: 0;
    flex-direction: column;
    overflow: hidden;     /* container chính ko cuộn — chỉ messages_scroll cuộn */
  }
  #zV2_col_main {
    overflow: hidden;
    min-height: 0;        /* CHO PHÉP flex shrink — bắt buộc để scroll trong */
  }
  #zV2_messages_scroll {
    flex: 1 1 0;
    min-height: 0;        /* same — flex item phải có min-height:0 để overflow hoạt động */
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  /* Compose chừa safe-area dưới (home indicator iPhone) + đệm tránh Safari nav bar che */
  #_chat_panel #zV2_compose_wrap {
    /* env(safe-area-inset-bottom) = 0 ở Safari thường, ~34px ở iPhone home indicator */
    /* max() đảm bảo TỐI THIỂU 28px breathing room dù không có safe-area */
    padding-bottom: max(28px, calc(12px + env(safe-area-inset-bottom)));
    flex-shrink: 0;
    z-index: 5;
  }
  /* Rail → thanh ngang ở TOP, chỉ giữ 2 tab Tin nhắn / Danh bạ */
  #zV2_rail {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: auto;
    padding: 6px 8px;
    gap: 6px;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #0084FF 0%, #0068FF 100%);
    border-bottom: none;
    flex-shrink: 0;
  }
  #zV2_rail_logo { display: none; }
  #zV2_rail_spacer { display: none; }
  #zV2_rail_btn_settings { display: none; }
  #zV2_rail .zV2_rail_btn {
    flex: 1;
    max-width: 160px;
    height: 38px;
    border-radius: 19px;
  }
  #zV2_rail .zV2_rail_btn.active {
    background: rgba(255,255,255,.25);
  }
  #zV2_rail .zV2_rail_tooltip { display: none; }
  #zV2_col_middle {
    width: 100%;
    border-right: none;
    flex: 1;
  }
  #zV2_col_main {
    width: 100%;
    display: none;
    flex: 1;
  }
  /* Khi xem chat: ẩn rail + middle, chỉ chat full screen */
  #_chat_panel.show-main #zV2_rail { display: none; }
  #_chat_panel.show-main #zV2_col_middle { display: none; }
  #_chat_panel.show-main #zV2_col_main { display: flex; }
  #main_back_btn,
  #zV2_main_back_btn { display: flex; }
  #zV2_info_panel { width: 100%; }
  #zV2_panel_close_btn { top: 8px; right: 8px; }
  /* Ẩn nút × close panel khi đang xem chat (để dành space cho back btn) */
  #_chat_panel.show-main #zV2_panel_close_btn { display: none; }
}

/* ============================================================
   SCROLLBARS — slim
   ============================================================ */
#_chat_widget_root *::-webkit-scrollbar { width: 6px; height: 6px; }
#_chat_widget_root *::-webkit-scrollbar-track { background: transparent; }
#_chat_widget_root *::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
#_chat_widget_root *::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* ============================================================
   ZALO V2 — DANH BẠ (giống Zalo mobile: avatar to + call/video icons)
   ============================================================ */
#_chat_widget_root .zV2_contact_group_header {
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 2;
  padding: 8px 16px 4px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: .4px;
  border-bottom: 1px solid var(--bg-page);
}
#_chat_widget_root .zV2_contact_item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px 10px 16px;
  cursor: pointer;
  transition: background .12s ease;
  position: relative;
}
#_chat_widget_root .zV2_contact_item::after {
  content: '';
  position: absolute;
  left: 76px; right: 14px; bottom: 0;
  height: 1px;
  background: var(--bg-page);
}
#_chat_widget_root .zV2_contact_item:last-child::after { display: none; }
#_chat_widget_root .zV2_contact_item:hover { background: var(--bg-page); }
#_chat_widget_root .zV2_contact_avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 600;
  font-size: 18px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
#_chat_widget_root .zV2_contact_avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
#_chat_widget_root .zV2_contact_avatar .zV2_conv_dot_online {
  position: absolute;
  bottom: 2px; right: 2px;
  width: 12px; height: 12px;
  background: var(--success);
  border: 2px solid #fff;
  border-radius: 50%;
  display: block;
}
#_chat_widget_root .zV2_contact_body {
  flex: 1;
  min-width: 0;
}
#_chat_widget_root .zV2_contact_name {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#_chat_widget_root .zV2_contact_sub {
  font-size: 12.5px;
  color: var(--brand);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#_chat_widget_root .zV2_contact_actions {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}
#_chat_widget_root .zV2_contact_btn {
  width: 36px;
  height: 36px;
  border: none;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s, color .12s;
}
#_chat_widget_root .zV2_contact_btn:hover { background: var(--brand-soft); color: var(--z-blue); }
#_chat_widget_root .zV2_contact_btn:active { transform: scale(.92); }

/* ── Image bubble (Zalo-like compact size + lightbox cursor) ── */
.zV2_msg_img {
  max-width: 240px;
  max-height: 300px;
  height: auto;
  border-radius: 10px;
  display: block;
  cursor: zoom-in;
  object-fit: cover;
  border: none;
  outline: none;
}
/* Bubble chứa chỉ ảnh: bỏ background/shadow/padding để chỉ thấy ảnh */
.zV2_bubble.zV2_bubble--image {
  background: transparent !important;
  box-shadow: none !important;
  padding: 0 !important;
  border: none !important;
}
.zV2_bubble.zV2_bubble--image .zV2_msg_text { padding: 6px 12px 0; }
/* Khi nằm trong bubble — bo viền theo bubble */
.zV2_bubble > .zV2_msg_img,
.zV2_bubble .zV2_msg_text + .zV2_msg_img {
  margin: 2px 0;
}
/* Mobile: hẹp hơn */
@media (max-width: 600px) {
  .zV2_msg_img { max-width: 180px; max-height: 240px; }
}

/* ── Sender name (group chat — khác biệt với nội dung tin) ── */
.zV2_msg_sender_name {
  font-size: 12px;
  font-weight: 700;
  color: var(--success-fg);
  padding: 0 14px 3px 14px;
  margin-bottom: 1px;
  letter-spacing: .15px;
  line-height: 1.3;
  display: block;
}
.zV2_msg_row--own .zV2_msg_sender_name { display: none !important; }

/* ── Skeleton loading khi chờ tin nhắn ── */
.zV2_msg_skel_wrap { padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; }
.zV2_msg_skel {
  height: 38px; border-radius: 18px; background: linear-gradient(90deg,var(--bg-page) 25%,var(--bg-page) 50%,var(--bg-page) 75%);
  background-size: 200% 100%; animation: zV2_skelShimmer 1.4s infinite; max-width: 65%;
}
.zV2_msg_skel--in  { align-self: flex-start; margin-left: 44px; }
.zV2_msg_skel--out { align-self: flex-end; background: linear-gradient(90deg,var(--brand-soft) 25%,var(--brand-soft) 50%,var(--brand-soft) 75%); background-size: 200% 100%; animation: zV2_skelShimmer 1.4s infinite; }
.zV2_msg_skel--short { max-width: 38%; height: 32px; }
@keyframes zV2_skelShimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── Lightbox (popup ảnh lớn) ── */
.zV2_lightbox_overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .88);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  cursor: zoom-out;
  animation: zV2_lightboxFade .15s ease-out;
  padding: 24px;
  box-sizing: border-box;
}
@keyframes zV2_lightboxFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.zV2_lightbox_img {
  max-width: 95vw;
  max-height: 92vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 60px rgba(0, 0, 0, .6);
  user-select: none;
  cursor: default;
  animation: zV2_lightboxZoom .18s cubic-bezier(.2, .9, .3, 1.2);
}
@keyframes zV2_lightboxZoom {
  from { transform: scale(.92); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.zV2_lightbox_close {
  position: fixed;
  top: 18px;
  right: 22px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .12);
  color: #fff;
  border: 0;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, transform .15s;
  backdrop-filter: blur(8px);
  z-index: 1;
}
.zV2_lightbox_close:hover {
  background: rgba(255, 255, 255, .25);
  transform: scale(1.05);
}
.zV2_lightbox_close:active {
  transform: scale(.95);
}

/* ── Recalled message text ── */
.zV2_deleted_text {
  font-style: italic;
  color: var(--z-muted);
}
.zV2_msg_row--own .zV2_bubble--recalled .zV2_deleted_text { color: rgba(255, 255, 255, .85); }

/* File card */
.zV2_msg_file_card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(255,255,255,.6);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
  border: 1px solid rgba(0,0,0,.06);
}
.zV2_bubble--own .zV2_msg_file_card {
  background: rgba(255,255,255,.15);
  border-color: rgba(255,255,255,.2);
}
.zV2_msg_file_icon { font-size: 22px; }
.zV2_msg_file_name { font-size: 13px; font-weight: 600; }
.zV2_msg_file_meta { font-size: 11px; opacity: .7; }

/* ── Dropdown menu cho ℹ️ trên header (Ghim / Ẩn / Xoá) ── */
.zV2_info_menu {
  position: fixed;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.06);
  padding: 6px 0;
  min-width: 220px;
  z-index: 100000;
  animation: zV2_menu_in .15s ease;
}
@keyframes zV2_menu_in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.zV2_info_menu_item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--text-1);
  cursor: pointer;
  transition: background .12s;
}
.zV2_info_menu_item:hover { background: var(--bg-page); }
.zV2_info_menu_item.danger { color: var(--danger); }
.zV2_info_menu_item.danger:hover { background: var(--danger-soft); }
.zV2_info_menu_item svg { flex-shrink: 0; }

/* ── Compose emoji picker (8 cột grid) ── */
.zV2_compose_emoji_pop {
  position: fixed;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 12px 36px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.06);
  padding: 8px;
  width: 312px;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 2px;
  z-index: 100000;
  animation: zV2_menu_in .15s ease;
  max-height: 280px;
  overflow-y: auto;
}
.zV2_compose_emoji_btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: none;
  background: transparent;
  font-size: 20px;
  cursor: pointer;
  padding: 0;
  transition: transform .12s, background .12s;
}
.zV2_compose_emoji_btn:hover {
  background: var(--bg-page);
  transform: scale(1.2);
}

/* ── Emoji picker popup (mềm, bo, shadow) ── */
.zV2_emoji_picker_pop {
  background: #fff;
  border-radius: 28px;
  box-shadow: 0 12px 36px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.06);
  padding: 6px 8px;
  display: flex;
  align-items: center;
  gap: 2px;
  border: 1px solid var(--bg-page);
  animation: zV2_emoji_pop_in .2s cubic-bezier(.34,1.56,.64,1);
}
@keyframes zV2_emoji_pop_in {
  from { opacity: 0; transform: translateY(8px) scale(.85); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
.zV2_emoji_btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  font-size: 22px;
  cursor: pointer;
  transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .12s;
  padding: 0;
  line-height: 1;
}
.zV2_emoji_btn:hover {
  transform: scale(1.4);
  background: var(--bg-page);
}
.zV2_emoji_btn:active { transform: scale(1.1); }

/* ── Modal chung (Tạo nhóm / Thêm thành viên / Đổi tên / ...) ── */
.zV2_modal_overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  animation: zV2_modal_in .18s ease;
  padding: 16px;
}
@keyframes zV2_modal_in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.zV2_modal_card {
  background: #fff;
  border-radius: 14px;
  width: 100%;
  max-width: 680px;

    max-height: calc(100dvh - 32px);

  }
}
@keyframes zV2_modal_card_in {

  to   { opacity: 1; transform: translateY(0)    scale(1); }

}

.zV2_modal_overlay .zV2_picker_groupname,

}

.zV2_picker_cb { width: 18px; height: 18px; flex-shrink: 0; accent-color: #0084FF; cursor: pointer; }
.zV2_picker_avatar {
  width: 36px;
  height: 36px;

}

.zV2_picker_name {
  font-size: 14px;

  color: var(--text-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.zV2_picker_sub {
  font-size: 12px;
  color: var(--text-3);

}
.zV2_modal_footer {

  background: var(--bg-page);

}

.zV2_btn_danger {
  background: var(--danger-soft);
  color: var(--danger);
}
.zV2_btn_danger:hover { background: var(--danger-soft); }
.zV2_empty_hint { padding: 24px; text-align: center; color: var(--text-3); font-size: 13px; }

.zV2_dept_dropdown_menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--bg-page);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
  z-index: 100;
  max-height: 260px;
  overflow-y: auto;
  padding: 4px;
}
.zV2_dept_item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background .12s;
}
.zV2_dept_item:hover { background: var(--brand-soft); }
.zV2_dept_cb { width: 18px; height: 18px; accent-color: #0068FF; flex-shrink: 0; cursor: pointer; }
.zV2_dept_item_name { flex: 1; font-size: 14px; color: var(--text-1); }
.zV2_dept_item_count {
  font-size: 12px;
  color: var(--text-3);
  background: var(--bg-page);
  padding: 1px 8px;
  border-radius: 10px;
}

/* Wrapper cho bubble + reactions + actions — anchor cho absolute children */
.zV2_bubble_outer { position: relative; display: inline-block; max-width: 100%; }
.zV2_msg_bubble_wrap { display: flex; flex-direction: column; }

/* Reaction chip — lồi vào góc dưới bubble (Zalo style) */
.zV2_bubble_reactions {
  /* position:absolute + bottom:-10 đã set ở skeleton — giữ nguyên đè lên bubble */
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: #fff;
  border: 1px solid var(--bg-page);
  border-radius: 14px;
  padding: 2px 6px;
  font-size: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,.10);
  cursor: pointer;
  z-index: 2;
  transition: transform .1s;
}
.zV2_bubble_reactions:hover { transform: scale(1.05); }
.zV2_bubble_reactions:active { transform: scale(.94); }

.zV2_reaction_chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  font-size: 12px;
}
.zV2_reaction_chip--mine { color: #0068FF; font-weight: 600; }
.zV2_reaction_count { font-size: 11.5px; opacity: .85; }

/* Tabs trên Danh bạ: Tất cả X / Mới truy cập Y */
#_chat_widget_root .zV2_contacts_topbar {
  display: flex;
  gap: 8px;
  padding: 10px 14px 6px;
  background: #fff;
  border-bottom: 1px solid var(--bg-page);
}
#_chat_widget_root .zV2_contacts_chip {
  padding: 6px 14px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: 600;
  background: var(--bg-page);
  color: var(--text-2);
  cursor: pointer;
  border: none;
}
#_chat_widget_root .zV2_contacts_chip.active {
  background: var(--brand-soft);
  color: var(--z-blue);
}

/* ── Thread panel (hội thoại độc lập) ── */
#zV2_thread_panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 320px; background: #fff;
  border-left: 1px solid var(--z-border);
  display: flex; flex-direction: column;
  z-index: 25; box-shadow: -4px 0 16px rgba(0,0,0,.08);
  transform: translateX(100%); transition: transform .22s ease;
}
#zV2_thread_panel.open { transform: translateX(0); }
#zV2_thread_header {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 16px; border-bottom: 1px solid var(--z-border);
  font-weight: 600; font-size: 14px; color: var(--z-text); flex-shrink: 0;
}
#zV2_thread_close {
  margin-left: auto; background: none; border: none; cursor: pointer;
  color: var(--z-muted); font-size: 18px; padding: 4px 8px; border-radius: 6px; line-height: 1;
}
#zV2_thread_close:hover { background: var(--z-hover); color: var(--z-text); }
#zV2_thread_root_wrap {
  padding: 10px 14px; background: var(--brand-soft);
  border-bottom: 1px solid var(--z-border); flex-shrink: 0;
  font-size: 13px; color: var(--z-text); max-height: 100px; overflow: hidden;
}
#zV2_thread_root_wrap .thr_sender { font-weight: 600; color: var(--z-blue); font-size: 11px; margin-bottom: 2px; }
#zV2_thread_root_wrap .thr_content { color: var(--text-1); line-height: 1.4; }
#zV2_thread_scroll {
  flex: 1; overflow-y: auto; padding: 10px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.zV2_thr_reply {
  background: var(--z-bg); border-radius: 10px; padding: 7px 11px;
  font-size: 13px; line-height: 1.45; max-width: 90%;
}
.zV2_thr_reply--own { background: var(--brand-soft); align-self: flex-end; }
.zV2_thr_reply_sender { font-weight: 600; font-size: 11px; color: var(--z-blue); margin-bottom: 2px; }
.zV2_thr_reply_time { font-size: 10px; color: var(--z-muted); margin-top: 3px; }
#zV2_thread_compose_wrap {
  border-top: 1px solid var(--z-border); padding: 9px 12px;
  display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0;
}
#zV2_thread_input {
  flex: 1; border: 1px solid var(--z-border); border-radius: 18px;
  padding: 7px 13px; font-size: 13px; resize: none; outline: none;
  font-family: inherit; max-height: 90px; min-height: 34px; line-height: 1.4;
  overflow-y: auto;
}
#zV2_thread_input:focus { border-color: var(--z-blue); }
#zV2_thread_send_btn {
  width: 34px; height: 34px; border-radius: 50%; background: var(--z-blue);
  color: #fff; border: none; cursor: pointer; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
#zV2_thread_send_btn:hover { background: var(--z-blue-dark); }
.zV2_thread_badge {
  font-size: 11px; color: var(--z-blue); cursor: pointer; margin-top: 3px;
  display: inline-block; padding: 1px 0;
}
.zV2_thread_badge:hover { text-decoration: underline; }
@media (max-width: 700px) {
  #zV2_thread_panel { width: 100%; border-left: none; }
}

/* ── Search trong chat (toggled by zV2_btn_msg_search) ── */
#zV2_msg_search_bar {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--bg-page);
  border-bottom: 1px solid var(--brand-soft);
  flex-shrink: 0;
}
#zV2_msg_search_bar.active { display: flex; }
#zV2_msg_search_bar .zV2_msg_search_icon { color: var(--text-3); flex-shrink: 0; }
#zV2_msg_search_input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  background: #fff;
  outline: none;
}
#zV2_msg_search_input:focus { border-color: var(--brand); }
.zV2_msg_search_count {
  font-size: 12px;
  color: var(--text-3);
  min-width: 38px;
  text-align: center;
  user-select: none;
}
.zV2_msg_search_count.no-match { color: var(--danger); }
.zV2_msg_search_nav, .zV2_msg_search_close {
  width: 26px; height: 26px;
  border: none; background: transparent;
  border-radius: 4px;
  cursor: pointer; color: var(--text-3);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
}
.zV2_msg_search_nav:hover, .zV2_msg_search_close:hover { background: var(--brand-soft); color: var(--brand); }
.zV2_msg_search_nav:disabled { opacity: .35; cursor: not-allowed; }
.zV2_msg_search_close { font-size: 18px; }

/* Highlight matches trong bubble */
.zV2_bubble mark.zV2_search_hit {
  background: var(--warning); color: inherit; padding: 0 1px; border-radius: 2px;
}
.zV2_bubble mark.zV2_search_hit.zV2_search_hit_active {
  background: var(--warning); color: #fff;
}

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

    </section>

    <!-- Close panel button -->
    <button type="button" id="zV2_panel_close_btn" aria-label="Đóng cửa sổ chat">&times;</button>
  </div>
</div>

<script>
(function(){
'use strict';

// ============================================================
// ZALO V2 CHAT WIDGET — INIT JS (Skeleton)
// Other agents append after END_SKELETON_JS marker.
// ============================================================

// ---------- Global state ----------
window._zV2 = window._zV2 || {
  open: false,
  currentTab: 'tin-nhan',
  currentRoomId: null,
  rooms: [],
  messages: {},
  users: [],
  online: new Set(),
  typing: {},
  sse: null,
  oldestMsgId: {},
  scrollLocked: {},
  replyTo: null,
  editingMsgId: null,
  infoPanelOpen: false,
  _roomsLoaded: false,
  _usersLoaded: false
};

// ---------- Shortcuts ----------
var $ = function(id){ return document.getElementById(id); };
var $$ = function(sel, root){ return (root || document).querySelectorAll(sel); };

// ---------- Element refs (cached after DOMContentLoaded) ----------
var $panel, $fab, $fabBadge;
var $rail, $railTin, $railDanhba, $railSettings, $railBadgeTin;
var $colMiddle, $midHeader, $midAvatar, $midName, $btnNewGroup;
var $searchBox, $tabsFilter, $convList, $contactsList, $emptyList;
var $colMain, $emptyMain;
var $mainHeader, $mainAvatar, $mainTitle, $mainMeta, $mainBackBtn;
var $btnCall, $btnVideo, $btnInfo;
var $messagesScroll, $messagesInner;
var $typing, $scrollBottomBtn, $scrollBadge;
var $replyStrip, $replyTo, $replyText, $replyCloseBtn;
var $composeWrap, $composeInput, $composeSendWrap, $thumbsBtn, $sendBtn;
var $btnEmoji, $btnSticker, $btnImage, $btnFile, $btnMic;
var $infoPanel, $infoHeader, $infoTitle, $infoCloseBtn, $infoTabs;
var $panelCloseBtn;

function zV2_cacheRefs(){
  $panel             = $('_chat_panel');
  $fab               = $('_chat_fab');
  $fabBadge          = $('_chat_fab_badge');

  $rail              = $('zV2_rail');
  $railTin           = $('zV2_rail_btn_tin');
  $railDanhba        = $('zV2_rail_btn_danhba');
  $railSettings      = $('zV2_rail_btn_settings');
  $railBadgeTin      = $('zV2_rail_badge_tin');

  $colMiddle         = $('zV2_col_middle');
  $midHeader         = $('zV2_mid_header');
  $midAvatar         = $('zV2_mid_header_avatar');
  $midName           = $('zV2_mid_header_name');
  $btnNewGroup       = $('zV2_btn_new_group');

  $searchBox         = $('zV2_search_box');
  $tabsFilter        = $('zV2_tabs_filter');
  $convList          = $('zV2_conv_list');
  $contactsList      = $('zV2_contacts_list');
  $emptyList         = $('zV2_empty_list');

  $colMain           = $('zV2_col_main');
  $emptyMain         = $('zV2_empty_main');

  $mainHeader        = $('zV2_main_header');
  $mainAvatar        = $('zV2_main_avatar');
  $mainTitle         = $('zV2_main_title');
  $mainMeta          = $('zV2_main_meta');
  $mainBackBtn       = $('zV2_main_back_btn');

  $btnCall           = $('zV2_btn_call');
  $btnVideo          = $('zV2_btn_video');
  $btnInfo           = $('zV2_btn_info');

  $messagesScroll    = $('zV2_messages_scroll');
  $messagesInner     = $('zV2_messages_inner');

  $typing            = $('zV2_typing_indicator');
  $scrollBottomBtn   = $('zV2_scroll_bottom_btn');
  $scrollBadge       = $('zV2_scroll_badge');

  $replyStrip        = $('zV2_reply_strip');
  $replyTo           = $('zV2_reply_to');
  $replyText         = $('zV2_reply_text');
  $replyCloseBtn     = $('zV2_reply_close_btn');

  $composeWrap       = $('zV2_compose_wrap');
  $composeInput      = $('zV2_compose_input');
  $composeSendWrap   = $('zV2_compose_send_wrap');
  $thumbsBtn         = $('zV2_thumbs_btn');
  $sendBtn           = $('zV2_send_btn');

  $btnEmoji          = $('zV2_btn_emoji');
  $btnSticker        = $('zV2_btn_sticker');
  $btnImage          = $('zV2_btn_image');
  $btnFile           = $('zV2_btn_file');
  $btnMic            = $('zV2_btn_mic');

  $infoPanel         = $('zV2_info_panel');
  $infoHeader        = $('zV2_info_header');
  $infoTitle         = $('zV2_info_title');
  $infoCloseBtn      = $('zV2_info_close_btn');
  $infoTabs          = $('zV2_info_tabs');

  $panelCloseBtn     = $('zV2_panel_close_btn');

  // expose for other agents (no risk of TDZ)
  window._zV2._refs = {
    panel: $panel, fab: $fab,
    rail: $rail, railTin: $railTin, railDanhba: $railDanhba,
    convList: $convList, contactsList: $contactsList,
    mainHeader: $mainHeader, messagesScroll: $messagesScroll,
    messagesInner: $messagesInner, typing: $typing,
    scrollBottomBtn: $scrollBottomBtn, replyStrip: $replyStrip,
    composeInput: $composeInput, thumbsBtn: $thumbsBtn,
    sendBtn: $sendBtn, infoPanel: $infoPanel,
    emptyMain: $emptyMain, composeWrap: $composeWrap
  };
}

// ---------- Stub functions (other agents override via window.zV2_*) ----------
window.zV2_loadRooms      = window.zV2_loadRooms      || function(){};
window.zV2_renderRooms    = window.zV2_renderRooms    || function(){};
window.zV2_loadUsers      = window.zV2_loadUsers      || function(){};
window.zV2_renderContacts = window.zV2_renderContacts || function(){};
window.zV2_openRoom       = window.zV2_openRoom       || function(){};
window.zV2_loadMessages   = window.zV2_loadMessages   || function(){};
window.zV2_renderMessages = window.zV2_renderMessages || function(){};
window.zV2_buildBubble    = window.zV2_buildBubble    || function(){};
window.zV2_sendMessage    = window.zV2_sendMessage    || function(){};
window.zV2_handleSSE      = window.zV2_handleSSE      || function(){};
window.zV2_openInfoPanel  = window.zV2_openInfoPanel  || function(){
  if (!$infoPanel) return;
  $infoPanel.classList.add('open');
  window._zV2.infoPanelOpen = true;
  if ($btnInfo) $btnInfo.classList.add('active');
};
window.zV2_closeInfoPanel = window.zV2_closeInfoPanel || function(){
  if (!$infoPanel) return;
  $infoPanel.classList.remove('open');
  window._zV2.infoPanelOpen = false;
  if ($btnInfo) $btnInfo.classList.remove('active');
};
window.zV2_toggleInfoPanel = window.zV2_toggleInfoPanel || function(){
  if (window._zV2.infoPanelOpen) window.zV2_closeInfoPanel();
  else window.zV2_openInfoPanel();
};
window.zV2_setReplyTo     = window.zV2_setReplyTo     || function(){};
window.zV2_clearReplyTo   = window.zV2_clearReplyTo   || function(){
  if (!$replyStrip) return;
  $replyStrip.classList.remove('visible');
  window._zV2.replyTo = null;
};
window.zV2_focusInput     = window.zV2_focusInput     || function(){
  if ($composeInput) try { $composeInput.focus(); } catch(_){}
};
window.zV2_scrollToBottom = window.zV2_scrollToBottom || function(){
  if ($messagesScroll) $messagesScroll.scrollTop = $messagesScroll.scrollHeight;
};
window.zV2_showTyping     = window.zV2_showTyping     || function(){};
window.zV2_hideTyping     = window.zV2_hideTyping     || function(){};
window.zV2_updateUnreadBadges = function(){
  var total = 0;
  var rooms = (window._zV2 && _zV2.rooms) || [];
  var hidden = (typeof window.zV2_hiddenRooms === 'function') ? window.zV2_hiddenRooms() : new Set();
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    if (hidden.has(r.id)) continue;
    total += (r.unread_count || 0);
  }
  var fab = document.getElementById('_chat_fab');
  var badge = document.getElementById('_chat_fab_badge');
  if (badge) badge.textContent = total > 99 ? '99+' : String(total);
  if (fab) {
    if (total > 0) fab.classList.add('has-unread');
    else fab.classList.remove('has-unread');
  }
  // Đổi title document để mọi tab biết có tin
  if (total > 0) {
    if (!document.title.startsWith('(' + total + ')')) {
      document.title = '(' + (total > 99 ? '99+' : total) + ') ' + (window._zV2_origTitle || document.title);
    }
  } else if (window._zV2_origTitle) {
    document.title = window._zV2_origTitle;
  }
};
// Lưu title gốc lần đầu chạy
if (typeof window._zV2_origTitle === 'undefined') {
  window._zV2_origTitle = (document.title || '').replace(/^\(\d+\+?\)\s*/, '');
}
// Notification + sound khi có tin mới (chỉ kích khi widget closed hoặc khác room)
window.zV2_notifyNewMessage = function(msg, room){
  try {
    // 1) Sound beep (Web Audio API, không cần file)
    if (!window._zV2_audioCtx) {
      try { window._zV2_audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){}
    }
    var ctx = window._zV2_audioCtx;
    if (ctx && ctx.state === 'suspended') ctx.resume();
    if (ctx) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.25);
    }
  } catch(_){}
  // 2) Browser notification (nếu permission granted)
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && !document.hasFocus()) {
      var senderName = msg.sender_name || msg.sender_username || 'Ai đó';
      var roomName = (room && (room.display_name || room.name)) || '';
      var bodyText = msg.content || (msg.msg_type === 'image' ? 'Đã gửi ảnh' : (msg.msg_type === 'file' ? 'Đã gửi file' : ''));
      var n = new Notification(senderName + (roomName && roomName !== senderName ? ' • ' + roomName : ''), {
        body: bodyText,
        icon: '/static/papasan_icon_1024.png',
        tag: 'chat-' + (msg.room_id || ''),
      });
      n.onclick = function(){ window.focus(); if (typeof zV2_open === 'function') zV2_open(); if (room && typeof zV2_openRoom === 'function') zV2_openRoom(room.id); n.close(); };
    }
  } catch(_){}
};
// Xin permission notification 1 lần khi user open chat lần đầu
window.zV2_askNotificationPermission = function(){
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  } catch(_){}
};

// Alias để các call site dùng renderConvList vẫn work — DEBOUNCED để gộp nhiều SSE event
var _zV2_renderConvTimer = null;
window.zV2_renderConvList = function(){
  // Luôn update badge ngay (cheap)
  window.zV2_updateUnreadBadges();
  // Debounce render heavy DOM 50ms (gộp nhiều SSE event trong vài chục ms)
  if (_zV2_renderConvTimer) return;
  _zV2_renderConvTimer = requestAnimationFrame(function(){
    _zV2_renderConvTimer = null;
    if (typeof window.zV2_renderRooms === 'function') {
      var q = (document.getElementById('zV2_search_box') || {}).value || '';
      window.zV2_renderRooms(q);
    }
  });
};
window.zV2_initSSE        = window.zV2_initSSE        || function(){};
window.zV2_closeSSE       = window.zV2_closeSSE       || function(){};
window.zV2_openSettings   = window.zV2_openSettings   || function(){};

// ---------- Tab switching ----------
function zV2_switchTab(name){
  window._zV2.currentTab = name;

  // Rail btn active state
  if ($railTin)      $railTin.classList.toggle('active',      name === 'tin-nhan');
  if ($railDanhba)   $railDanhba.classList.toggle('active',   name === 'danh-ba');

  if (name === 'tin-nhan'){
    if ($convList)     $convList.style.display     = 'block';
    if ($contactsList) $contactsList.style.display = 'none';
    if ($tabsFilter)   $tabsFilter.style.display   = '';
    if ($searchBox)    $searchBox.placeholder      = 'Tìm cuộc trò chuyện...';
  } else if (name === 'danh-ba'){
    if ($convList)     $convList.style.display     = 'none';
    if ($contactsList) $contactsList.style.display = 'block';
    if ($tabsFilter)   $tabsFilter.style.display   = 'none';
    if ($searchBox)    $searchBox.placeholder      = 'Tìm liên hệ...';

    try { window.zV2_loadUsers && window.zV2_loadUsers(); } catch(e){ console.warn('[zV2] loadUsers fail', e); }
  }
}
window.zV2_switchTab = zV2_switchTab;

// ---------- Open / close panel ----------
function zV2_open(){
  if (!$panel) zV2_cacheRefs();
  if (!$panel) return;
  window._zV2.open = true;
  $panel.classList.add('open');
  if (!window._zV2._roomsLoaded){
    try { window.zV2_loadRooms(); } catch(e){ console.warn('[zV2] loadRooms stub', e); }
  }
  try { window.zV2_initSSE(); } catch(_){}
  // Force poll presence ngay khi mở widget → đỡ stale
  try { window.zV2_handlePresenceUpdate && window.zV2_handlePresenceUpdate(); } catch(_){}
  // Xin quyền browser notification khi user lần đầu open chat
  try { window.zV2_askNotificationPermission && window.zV2_askNotificationPermission(); } catch(_){}
}
function zV2_close(){
  if (!$panel) return;
  window._zV2.open = false;
  $panel.classList.remove('open');
  // Reset mobile state
  $panel.classList.remove('show-main');
  // KHÔNG đóng SSE khi user đóng widget — vẫn cần nhận tin để bump FAB badge
  // try { window.zV2_closeSSE && window.zV2_closeSSE(); } catch(_){}
}
function zV2_toggle(){
  if (window._zV2.open) zV2_close();
  else zV2_open();
}
window.zV2_open   = zV2_open;
window.zV2_close  = zV2_close;
window.zV2_toggle = zV2_toggle;

// ---------- Composer input/send toggle ----------
function zV2_onComposeInput(){
  if (!$composeInput || !$composeSendWrap) return;
  var v = $composeInput.value || '';
  if (v.trim().length > 0) $composeSendWrap.classList.add('has-text');
  else                     $composeSendWrap.classList.remove('has-text');

  // Auto-resize textarea
  $composeInput.style.height = 'auto';
  var h = Math.min($composeInput.scrollHeight, 140);
  $composeInput.style.height = h + 'px';
}

function zV2_onComposeKeydown(e){
  // Enter = send, Shift+Enter = newline
  if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.isComposing && e.keyCode !== 229){
    e.preventDefault();
    try { window.zV2_sendMessage && window.zV2_sendMessage(); } catch(err){ console.warn(err); }
  }
}

// ---------- Scroll bottom button visibility ----------
function zV2_onMessagesScroll(){
  if (!$messagesScroll || !$scrollBottomBtn) return;
  var atBottom = ($messagesScroll.scrollHeight - $messagesScroll.scrollTop - $messagesScroll.clientHeight) < 80;
  var farUp    = ($messagesScroll.scrollHeight - $messagesScroll.scrollTop - $messagesScroll.clientHeight) > 300;
  if (farUp) $scrollBottomBtn.classList.add('visible');
  if (atBottom) $scrollBottomBtn.classList.remove('visible');

  var rid = window._zV2.currentRoomId;
  if (rid){
    window._zV2.scrollLocked[rid] = !atBottom;
  }
}

// ---------- Info-panel tabs ----------
function zV2_onInfoTabClick(e){
  var btn = e.target.closest('.zV2_info_tab_btn');
  if (!btn || !$infoTabs) return;
  var tab = btn.getAttribute('data-info-tab');
  if (!tab) return;
  // toggle button
  var btns = $infoTabs.querySelectorAll('.zV2_info_tab_btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  // toggle panel
  var panels = document.querySelectorAll('#zV2_info_body .zV2_info_tab_panel');
  for (var j = 0; j < panels.length; j++){
    panels[j].classList.toggle('active', panels[j].getAttribute('data-info-panel') === tab);
  }
}

// ---------- Filter tabs (Tất cả / Chưa đọc) ----------
function zV2_onFilterClick(e){
  var btn = e.target.closest('.zV2_tab_filter_btn');
  if (!btn) return;
  var siblings = $tabsFilter.querySelectorAll('.zV2_tab_filter_btn');
  for (var i = 0; i < siblings.length; i++) siblings[i].classList.remove('active');
  btn.classList.add('active');
  var f = btn.getAttribute('data-filter') || 'all';
  window._zV2.currentFilter = f;
  try { window.zV2_renderRooms && window.zV2_renderRooms(); } catch(_){}
}

// ---------- Mobile back ----------
function zV2_mobileBack(){
  if ($panel) $panel.classList.remove('show-main');
}

// ---------- Bind events ----------
function zV2_bind(){
  // FAB
  if ($fab) $fab.addEventListener('click', zV2_open);

  // Panel close
  if ($panelCloseBtn) $panelCloseBtn.addEventListener('click', zV2_close);

  // Rail tabs
  if ($railTin)      $railTin.addEventListener('click',      function(){ zV2_switchTab('tin-nhan'); });
  if ($railDanhba)   $railDanhba.addEventListener('click',   function(){ zV2_switchTab('danh-ba'); });
  if ($railSettings) $railSettings.addEventListener('click', function(){ try{ window.zV2_openSettings(); }catch(_){} });

  // Filter tabs
  if ($tabsFilter) $tabsFilter.addEventListener('click', zV2_onFilterClick);

  // Search box (other agents may attach handler too)
  if ($searchBox){
    $searchBox.addEventListener('input', function(e){
      window._zV2.searchQuery = (e.target.value || '').trim().toLowerCase();
      try {
        if (window._zV2.currentTab === 'tin-nhan') window.zV2_renderRooms && window.zV2_renderRooms();
        else                                       window.zV2_renderContacts && window.zV2_renderContacts();
      } catch(_){}
    });
  }

  // Main header actions — ℹ️ mở dropdown menu (ghim/ẩn/xoá)
  // Bind ở CAPTURE phase trên document để chắc chắn bắt click trước mọi handler khác
  document.addEventListener('click', function(ev){
    var btn = ev.target && ev.target.closest && ev.target.closest('#zV2_btn_info');
    if (!btn) return;
    ev.preventDefault();
    ev.stopPropagation();
    console.log('[zV2] btn_info clicked → openInfoMenu');
    if (typeof window.zV2_openInfoMenu === 'function') {
      window.zV2_openInfoMenu(btn);
    } else {
      alert('Lỗi: chức năng thông tin chưa load. F5 lại.');
    }
  }, true); /* capture: true */
  if ($mainBackBtn) $mainBackBtn.addEventListener('click', zV2_mobileBack);

  // Info panel
  if ($infoCloseBtn) $infoCloseBtn.addEventListener('click', function(){ window.zV2_closeInfoPanel(); });
  if ($infoTabs) $infoTabs.addEventListener('click', zV2_onInfoTabClick);

  // Composer — KHÔNG bind ở đây, zV2_composeBind() (msg.js) handle với guard _zV2Bound

  // Reply strip close
  if ($replyCloseBtn) $replyCloseBtn.addEventListener('click', function(){ window.zV2_clearReplyTo(); });

  // Scroll bottom btn
  if ($scrollBottomBtn) $scrollBottomBtn.addEventListener('click', function(){
    window.zV2_scrollToBottom();
    $scrollBottomBtn.classList.remove('visible', 'has-unread');
  });

  // Messages scroll listener
  if ($messagesScroll) $messagesScroll.addEventListener('scroll', zV2_onMessagesScroll);

  // ESC closes info panel first, then panel itself
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (!window._zV2.open) return;
    if (window._zV2.infoPanelOpen){
      window.zV2_closeInfoPanel();
      return;
    }
    zV2_close();
  });

  // Click outside panel = no-op (chat is modal-ish but persistent)
}

// ---------- Responsive breakpoint helper ----------
function zV2_applyBreakpoint(){
  if (!$panel) return;
  var w = window.innerWidth;
  $panel.classList.toggle('zV2-mobile', w < 600);
  $panel.classList.toggle('zV2-tablet', w >= 600 && w < 1024);
  $panel.classList.toggle('zV2-desktop', w >= 1024);
}

// ---------- Public surface: enter/exit room visual ----------
window.zV2_showChatSurface = window.zV2_showChatSurface || function(){
  if ($emptyMain)     $emptyMain.style.display     = 'none';
  if ($mainHeader)    $mainHeader.style.display    = '';
  if ($messagesScroll)$messagesScroll.style.display= '';
  if ($composeWrap)   $composeWrap.style.display   = '';
  if ($panel)         $panel.classList.add('show-main');
};
window.zV2_hideChatSurface = window.zV2_hideChatSurface || function(){
  if ($emptyMain)     $emptyMain.style.display     = '';
  if ($mainHeader)    $mainHeader.style.display    = 'none';
  if ($messagesScroll)$messagesScroll.style.display= 'none';
  if ($composeWrap)   $composeWrap.style.display   = 'none';
  if ($panel)         $panel.classList.remove('show-main');
};

// ---------- Apply current user to middle col header ----------
function zV2_applyCurrentUser(){
  var me = (typeof zV2_getCurrentUser === 'function')
    ? zV2_getCurrentUser()
    : { username: window.currentUsername || '', name: window.currentUserDisplayName || '' };
  zV2_renderMidHeaderAvatar(me);
  // Fetch /api/chat/me để lấy avatar_data thật (avatar nhân viên trong HCNS)
  fetch('/api/chat/me', { credentials: 'same-origin' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if (!data) return;
      var fullUser = {
        username: data.username,
        name: data.ho_ten || data.username,
        avatar_data: data.avatar_data,
        phong_ban: data.phong_ban,
        chuc_vu: data.chuc_vu,
      };
      if (window._zV2) _zV2.currentUser = fullUser;
      zV2_renderMidHeaderAvatar(fullUser);
    })
    .catch(function(){ /* silent */ });
}
function zV2_renderMidHeaderAvatar(me){
  var avEl = document.getElementById('zV2_mid_header_avatar');
  var nmEl = document.getElementById('zV2_mid_header_name');
  if (nmEl && me.name) nmEl.textContent = me.name;
  if (!avEl) return;
  if (me.avatar_data) {
    avEl.innerHTML = '<img src="' + me.avatar_data + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />';
    avEl.style.background = 'transparent';
  } else if (me.name) {
    var ch = (me.name.charAt(0) || '?').toUpperCase();
    avEl.textContent = ch;
    var palette = ['#0084FF','var(--brand)','var(--info)','var(--success)','var(--danger)','var(--danger)','var(--warning)','var(--brand)'];
    var hash = 0;
    for (var i = 0; i < me.name.length; i++) hash = (hash * 31 + me.name.charCodeAt(i)) >>> 0;
    avEl.style.background = palette[hash % palette.length];

// Format relative time cho last_seen (giờ/ngày trước)
function zV2_formatLastSeen(unixSec){
  if (!unixSec) return 'Chưa từng truy cập';
  var nowSec = Math.floor(Date.now() / 1000);
  var diff = nowSec - unixSec;
  if (diff < 60) return 'Vừa truy cập';
  if (diff < 3600) return 'Hoạt động ' + Math.floor(diff/60) + ' phút trước';
  if (diff < 86400) return 'Hoạt động ' + Math.floor(diff/3600) + ' giờ trước';
  var days = Math.floor(diff/86400);
  if (days < 30) return 'Hoạt động ' + days + ' ngày trước';
  return 'Hoạt động lâu rồi';
}

/* ==== INDEXEDDB PERSISTENT MESSAGE CACHE ==== */
(function () {
  var DB_NAME  = 'zV2Chat_v2';
  var DB_VER   = 1;
  var STORE    = 'msgs';
  var MAX_MSGS = 50;  // giữ tối đa 50 tin/phòng
  var _db = null;

  function openDB() {
    return new Promise(function (res, rej) {
      if (_db) { res(_db); return; }
      var r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE)) {
          var st = db.createObjectStore(STORE, { keyPath: ['room_id', 'id'] });
          st.createIndex('by_room', 'room_id');
        }
      };
      r.onsuccess = function (e) { _db = e.target.result; res(_db); };
      r.onerror   = function ()  { rej(r.error); };
    });
  }

  window.zV2_dbGet = function (roomId) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx  = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).index('by_room').getAll(IDBKeyRange.only(roomId));
        req.onsuccess = function () {
          res((req.result || []).sort(function (a, b) { return a.id - b.id; }));
        };
        req.onerror = function () { rej(req.error); };
      });
    });
  };

  window.zV2_dbSave = function (roomId, msgs) {
    if (!msgs || !msgs.length) return Promise.resolve();
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx    = db.transaction(STORE, 'readwrite');
        var store = tx.objectStore(STORE);
        // Upsert messages
        msgs.forEach(function (m) {
          store.put(Object.assign({}, m, { room_id: roomId, id: Number(m.id) }));
        });
        // Trim: giữ MAX_MSGS tin mới nhất — chạy sau khi upsert xong
        tx.oncomplete = function () {
          openDB().then(function (db2) {
            var tx2  = db2.transaction(STORE, 'readwrite');
            var idx2 = tx2.objectStore(STORE).index('by_room');
            var cntReq = idx2.count(IDBKeyRange.only(roomId));
            cntReq.onsuccess = function () {
              var excess = cntReq.result - MAX_MSGS;
              if (excess <= 0) { res(); return; }
              var curReq = idx2.openCursor(IDBKeyRange.only(roomId));
              curReq.onsuccess = function (ev) {
                var cur = ev.target.result;
                if (cur && excess > 0) { cur.delete(); excess--; cur.continue(); }
                else res();
              };
            };
          }).catch(res);
        };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  };

  window.zV2_dbLastId = function (roomId) {
    return window.zV2_dbGet(roomId).then(function (msgs) {
      return msgs.length ? msgs[msgs.length - 1].id : null;
    });
  };
})();

    const palette = ['#0084FF', 'var(--brand)', 'var(--info)', 'var(--success)', 'var(--danger)', 'var(--danger)', 'var(--warning)', 'var(--brand)'];
    const s = String(str || '');
    let h = 0;

if (typeof window.zV2_formatTime !== 'function') {
  window.zV2_formatTime = function (iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const sameDay = d.getFullYear() === now.getFullYear()
      && d.getMonth() === now.getMonth()
      && d.getDate() === now.getDate();
    if (sameDay) {
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${hh}:${mm}`;
    }
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((startToday - startDay) / 86400000);
    if (diffDays === 1) return 'Hôm qua';
    if (diffDays > 1 && diffDays < 7) {
      const names = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
      return names[d.getDay()];
    }
    const dd = String(d.getDate()).padStart(2, '0');
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    return `${dd}/${mo}`;
  };
}
